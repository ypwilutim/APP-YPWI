<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo DOKU Payment - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <div class="flex items-center space-x-3 mb-6">
      <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
        <i class="fas fa-credit-card text-white"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold text-gray-900">DOKU Payment Demo</h1>
        <p class="text-sm text-gray-600">Mode Demo - Tidak Ada Transaksi Nyata</p>
      </div>
    </div>

    <div id="demoStep1">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Pilih Sekolah</label>
        <select id="demoSchool" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          <option value="">-- Pilih Sekolah --</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Nama Siswa</label>
        <select id="demoStudent" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
          <option value="">-- Pilih Sekolah Dulu --</option>
        </select>
      </div>
      <button onclick="createDemoInvoice()" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        <i class="fas fa-credit-card mr-2"></i>Lanjutkan ke Pembayaran
      </button>
    </div>

    <div id="demoStep2" class="hidden">
      <div class="bg-gray-50 p-4 rounded-lg mb-4">
        <p class="text-sm text-gray-600">Kepada</p>
        <p class="font-medium" id="studentName">-</p>
        <p class="text-sm text-gray-600 mt-2">Jumlah Tagihan</p>
        <p class="text-2xl font-bold text-blue-600" id="invoiceAmount">Rp 500.000</p>
      </div>

      <button onclick="payWithDoku()" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 mb-2">
        <i class="fas fa-external-link-alt mr-2"></i>Buka Halaman DOKU
      </button>
      <button onclick="resetDemo()" class="w-full px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">
        Kembali
      </button>
    </div>
  </div>

  <script>
    let selectedStudentId = null;
    let selectedAmount = 500000;

    async function loadStudents() {
      const school = document.getElementById('demoSchool').value;
      const studentSelect = document.getElementById('demoStudent');
      
      if (!school) {
        studentSelect.innerHTML = '<option value="">-- Pilih Sekolah Dulu --</option>';
        return;
      }
      
      studentSelect.innerHTML = '<option value="">Memuat...</option>';
      
      try {
        const res = await fetch('/api/treasurer/public/students?tenant_id=' + school);
        const json = await res.json();
        
        if (json.success) {
          studentSelect.innerHTML = '<option value="">-- Pilih Siswa --</option>' + 
            json.data.map(s => '<option value="' + s.id + '" data-amount="' + (s.iuran_bulanan || 500000) + '">' + s.nama_siswa + '</option>').join('');
        } else {
          studentSelect.innerHTML = '<option value="">Gagal memuat siswa</option>';
        }
      } catch (e) {
        studentSelect.innerHTML = '<option value="">Error jaringan</option>';
      }
    }

    async function createDemoInvoice() {
      const studentId = document.getElementById('demoStudent').value;
      const school = document.getElementById('demoSchool').value;
      
      if (!studentId || !school) {
        alert('Pilih sekolah dan siswa dulu');
        return;
      }
      
      const selectedOption = document.getElementById('demoStudent').selectedOptions[0];
      const studentName = selectedOption.textContent;
      selectedAmount = selectedOption.dataset.amount || 500000;
      
      document.getElementById('studentName').textContent = studentName;
      document.getElementById('invoiceAmount').textContent = 'Rp ' + parseInt(selectedAmount).toLocaleString('id-ID');
      selectedStudentId = studentId;
      
      document.getElementById('demoStep1').classList.add('hidden');
      document.getElementById('demoStep2').classList.remove('hidden');
    }

    async function payWithDoku() {
      const school = document.getElementById('demoSchool').value;
      
      try {
        const res = await fetch('/api/doku/create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_id: school, student_id: parseInt(selectedStudentId), amount: parseFloat(selectedAmount) })
        });
        const json = await res.json();
        
        if (json.success && json.invoice_url) {
          // Cek apakah URL ke mock atau DOKU asli
          if (json.invoice_url.includes('mock-payment')) {
            alert('Mock payment - DOKU API belum aktif');
          }
          window.open(json.invoice_url, '_blank');
        } else {
          alert('Gagal buat invoice DOKU');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function resetDemo() {
      document.getElementById('demoStep2').classList.add('hidden');
      document.getElementById('demoStep1').classList.remove('hidden');
      selectedStudentId = null;
    }

    document.getElementById('demoSchool').addEventListener('change', loadStudents);
  </script>
</body>
</html>
