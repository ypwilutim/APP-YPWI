<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Payment - DOKU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 p-6">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
        <i class="fas fa-credit-card text-blue-600 text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-gray-900">DOKU Payment Gateway</h1>
      <p class="text-sm text-gray-600">Demo Mode - Tidak Ada Transaksi Nyata</p>
    </div>

    <div class="bg-gray-50 p-4 rounded-lg mb-4">
      <p class="text-sm text-gray-600">Invoice ID</p>
      <p class="font-medium" id="invoiceId">-</p>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Jumlah Bayar</label>
      <input type="text" id="amount" value="500000" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100" readonly>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Nama Siswa</label>
      <input type="text" id="studentName" value="Demo Siswa" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100" readonly>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Metode Pembayaran</label>
      <select id="method" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <option>BRI Virtual Account</option>
        <option>Mandiri Bill</option>
        <option>BNI Virtual Account</option>
        <option>QRIS</option>
        <option>Alfamart</option>
      </select>
    </div>
    
    <button id="payBtn" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
      <i class="fas fa-check mr-2"></i>Lanjutkan Pembayaran
    </button>

    <a href="/demo-pay.html" class="block text-center mt-3 text-sm text-gray-500 hover:text-gray-700">
      <i class="fas fa-arrow-left mr-1"></i>Kembali
    </a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('invoiceId').textContent = params.get('invoice') || '-';
    
    // Auto-select method & show
    document.getElementById('payBtn').addEventListener('click', () => {
      const method = document.getElementById('method').value;
      alert('Metode: ' + method + '\n\nRedirect ke halaman payment DOKU (Demo)');
      window.location.href = '/demo-success.html?invoice=' + encodeURIComponent(params.get('invoice'));
    });
  </script>
</body>
</html>
