<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Pundi Ceria - YPWI Lutim</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .confirmation-bg {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }
    .confirm-card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 600px;
      margin: 2rem auto;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 1rem;
    }
    .success-badge {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .info-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin: 0 auto 1.5rem;
    }
    .register-form .form-control {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.875rem;
      width: 100%;
      margin-bottom: 12px;
    }
    .register-form .form-control:focus {
      border-color: #3b82f6;
      outline: none;
    }
    .register-btn {
      width: 100%;
      padding: 12px 24px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .register-btn:hover {
      background-color: #2563eb;
    }
    .register-btn:focus {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="confirmation-bg min-h-screen flex items-center justify-center p-4">

  <div class="confirm-card">
    <div class="info-icon">
      <i class="fas fa-check-circle text-2xl"></i>
    </div>

    <div id="donorExists" class="mb-6 hidden">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Terima Kasih!</h2>
      <p class="text-gray-600 mb-4">Konfirmasi pesan Pundi Ceria berhasil diterima.</p>

      <div class="mb-6">
        <p class="text-sm text-gray-500 mb-2">Detail Donatur:</p>
        <p id="donaturName" class="font-medium text-gray-700"></p>
        <p id="donaturKelas" class="text-sm text-gray-500"></p>
      </div>

      <a href="/"
         class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">
        <i class="fas fa-home mr-2"></i>Kembali ke Beranda
      </a>
    </div>

    <div id="donorRegister" class="mb-6 hidden">
      <h2 class="text-2xl font-bold text-gray-900 mb-2">Daftar Donatur Baru</h2>
      <p class="text-gray-600 mb-4">Donatur belum terdaftar di sistem. Silakan lengkapi data di bawah ini.</p>

      <form id="registerForm" class="register-form">
        <input type="hidden" id="regNoWa" name="no_wa">
        <input type="hidden" id="regDonaturId" name="donaturId">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nama Donatur</label>
            <input type="text" id="regNamaDonatur" name="nama_donatur" class="form-control" placeholder="Nama donatur" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Kelas</label>
            <input type="text" id="regKelas" name="kelas" class="form-control" placeholder="Contoh: VII A" required>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Nama Siswa</label>
          <input type="text" id="regNamaSiswa" name="nama_siswa" class="form-control" placeholder="Nama siswa" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Sekolah/Yayasan</label>
          <input type="text" id="regSekolah" name="sekolah_yayasan" class="form-control" placeholder="Contoh: YPWI Lutim" required>
        </div>

        <button type="submit" class="register-btn">
          <i class="fas fa-user-plus mr-2"></i>Daftar Donatur
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const donorId = urlParams.get('donaturId');
      const noWa = urlParams.get('no_wa'); // Nomor WhatsApp dari pesan

      // Status tracking
      let donorData = null;

      // Phase 1: Cek apakah donatur exist berdasarkan ID atau no_wa
      const checkDonor = async () => {
        // Coba dulu berdasarkan donaturId dari URL
        if (donorId) {
          try {
            const res = await fetch(`/api/pundi-sedekah/donatur/${donorId}`);
            const data = await res.json();
            
            if (data.success && data.data) {
              donorData = data.data;
              showDonorExists();
              return;
            }
          } catch (e) {
            // Donatur ID tidak ditemukan, coba no_wa
          }
        }

        // Coba berdasarkan no_wa dari URL (untuk donatur baru)
        if (noWa) {
          try {
            const res = await fetch(`/api/pundi-sedekah/registrasi?no_wa=${encodeURIComponent(noWa)}`);
            const data = await res.json();
            
            if (data.success) {
              donorData = data.data;
              // Jika sudah ada di DB (update), tampilkan sebagai exist
              if (data.message && data.message.includes('sudah terdaftar')) {
                showDonorExists();
              } else {
                // Baru daftar, tampilkan form registrasi
                showDonorRegister(data.data);
              }
              return;
            }
          } catch (e) {
            // Error, lanjut ke form registrasi
          }
        }

        // Jika tidak ditemukan sama sekali, tampilkan form registrasi
        showDonorRegister(null);
      };

      // Tampilkan halaman donatur exist
      const showDonorExists = () => {
        document.getElementById('donorExists').classList.remove('hidden');
        document.getElementById('donorRegister').classList.add('hidden');

        if (donorData) {
          document.getElementById('donaturName').textContent = `${donorData.nama_donatur || ''}`;
          document.getElementById('donaturKelas').textContent = `Siswa: ${donorData.nama_siswa} (${donorData.kelas || 'Semua Kelas'})`;
        }
      };

      // Tampilkan form registrasi donatur baru
      const showDonorRegister = (existingData) => {
        document.getElementById('donorExists').classList.add('hidden');
        document.getElementById('donorRegister').classList.remove('hidden');

        // Jika ada data exist (untuk memperbarui), isi form
        if (existingData) {
          document.getElementById('regNoWa').value = existingData.no_wa || '';
          document.getElementById('regNamaDonatur').value = existingData.nama_donatur || '';
          document.getElementById('regNamaSiswa').value = existingData.nama_siswa || '';
          document.getElementById('regKelas').value = existingData.kelas || '';
          document.getElementById('regSekolah').value = existingData.sekolah_yayasan || '';
        }

        // Set no_wa dari URL params jika ada
        const urlNoWa = document.querySelector('input[name="no_wa"]');
        if (noWa && urlNoWa) {
          urlNoWa.value = noWa;
        }

        // Handle form submit
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const formData = {
            no_wa: document.getElementById('regNoWa').value,
            nama_donatur: document.getElementById('regNamaDonatur').value,
            nama_siswa: document.getElementById('regNamaSiswa').value,
            kelas: document.getElementById('regKelas').value,
            sekolah_yayasan: document.getElementById('regSekolah').value
          };

          try {
            const res = await fetch('/api/pundi-sedekah/registrasi', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formData)
            });
            const result = await res.json();
            
            if (result.success) {
              // Refresh halaman dengan data donatur yang terbaru
              donorData = result.data;
              showDonorExists();
            } else {
              alert('Gagal mendaftar: ' + result.message);
            }
          } catch (error) {
            alert('Terjadi error: ' + error.message);
          }
        });
      };

      // Jalankan cek donor
      checkDonor();
    });
  </script>

</body>
</html>
