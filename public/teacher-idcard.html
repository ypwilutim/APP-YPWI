<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Guru - YPWI Lutim (HTML Presisi)</title>

  <!-- Tailwind & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- Font Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- jsPDF & html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    body {
      background-color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .card-preview-wrapper {
      width: 300px;
      height: 472px;
      box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.1);
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      position: relative;
    }
  </style>
</head>

<body>
<!-- Overlay Loading -->
    <div id="loadingOverlay"
      class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white hidden">
      <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-4"></div>
      <p id="loadingText" class="font-semibold text-lg">Mengeksport PDF Presisi...</p>
      <p id="loadingSubtext" class="text-sm text-slate-300 mt-2">Mohon tunggu, merender font resolusi tinggi.</p>
      <div class="w-64 bg-slate-700 rounded-full h-2 mt-4 overflow-hidden">
        <div id="progressBar" class="bg-blue-500 h-full transition-all duration-200" style="width: 0%"></div>
      </div>
      <p id="progressPercent" class="text-xs text-slate-400 mt-2">0%</p>
    </div>

  <div class="container mx-auto px-4 py-8">
    <div class="max-w-6xl mx-auto">
      <!-- Header Actions -->
      <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div class="flex items-center gap-4">
          <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-id-card text-blue-600 mr-2"></i>ID Card Guru YPWI</h1>
          <span id="totalCount" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-medium">Total: 0 guru</span>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="exportAllPdf()"
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm">
            <i class="fas fa-file-pdf mr-2"></i>Export PDF Semua
          </button>
          <button onclick="exportSelectedPdf()"
            class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm">
            <i class="fas fa-check-square mr-2"></i>Export Terpilih
          </button>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="mb-4 flex flex-col sm:flex-row gap-3">
        <input type="text" id="searchInput" placeholder="Cari nama guru..."
          class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        <button onclick="toggleShowAll()" id="showAllBtn"
          class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap">
          Tampilkan Semua
        </button>
      </div>

      <!-- Grid Cards -->
      <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="text-center p-8 text-gray-500 col-span-full">Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    let teachersData = [];
    let filteredTeachers = [];
    let selectedIds = new Set();
    function getFallbackAvatar(gender, name) {
      const initial = (name || 'G').charAt(0).toUpperCase();
      let bgColor = '#066e3a';
      let iconSvg = '';
      
      if (gender === 'P') {
        // Hijab icon
        iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="48" height="48"><path d="M12 4c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2h2c0-1.1.9-2 2-2s2 .9 2 2h2c0-2.21-1.79-4-4-4zm0 14c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/><path d="M12 16c-2.21 0-4-1.79-4-4h2c0 1.1-.9 2-2 2s-2-.9-2-2H6c0 2.21 1.79 4 4 4zm0-10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z"/></svg>`;
      } else if (gender === 'L') {
        // Peci icon
        iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="48" height="48"><path d="M12 3c-4.97 0-9 4.03-9 9v2c0 1.66 1.34 3 3 3h12c1.66 0 3-1.34 3-3v-2c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7v1c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2v-1c0-3.87 3.13-7 7-7z"/></svg>`;
      } else {
        // Generic
        iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="48" height="48"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
      }
      
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150"><rect width="150" height="150" fill="${bgColor}"/><text x="75" y="95" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">${initial}</text><g transform="translate(51, 80)">${iconSvg.replace('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="48" height="48">', '').replace('</svg>', '')}</g></svg>`;
      
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }
    const PREVIEW_LIMIT = 3;

    function showLoading(msg, submsg) {
      document.getElementById('loadingText').innerText = msg;
      document.getElementById('loadingSubtext').innerText = submsg || 'Mohon tunggu, merender font resolusi tinggi.';
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('progressPercent').innerText = '0%';
      document.getElementById('loadingOverlay').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.add('hidden');
    }

    function updateProgress(current, total) {
      const pct = Math.round((current / total) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressPercent').innerText = pct + '%';
      document.getElementById('loadingSubtext').innerText = `Merender kartu ${current} dari ${total}...`;
    }

    // Generator DOM HTML (Revisi: Tengah penuh data, Bawah khusus QR Code)
    function generateCardHTML(teacher) {
      const scanId = teacher.scan_id || teacher.id || '-';
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(scanId)}`;
      const formattedDate = teacher.tmt ? new Date(teacher.tmt).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';
      const foto = teacher.link_foto || getFallbackAvatar(teacher.jenis_kelamin, teacher.nama);
      const sekolahName = teacher.nama_sekolah || 'YPWI LUTIM';
      const noTelp = teacher.no_wa || '-';

return `
        <div id="card-node-${teacher.id}" class="w-[300px] h-[472px] bg-white rounded-[16px] border-[2px] border-slate-200 overflow-hidden relative box-border flex flex-col" style="font-family: 'Plus Jakarta Sans', sans-serif;">
            
            <!-- Header Background & Curve -->
            <div class="h-[100px] bg-gradient-to-br from-blue-600 via-sky-600 to-teal-600 rounded-b-[20px] flex-shrink-0 relative">
            
            <!-- Header Decorative Elements -->
            <div class="absolute top-[-15px] right-[15px] w-[90px] h-[90px] bg-white opacity-15 rounded-full"></div>
            <div class="absolute top-[8px] left-[134px] w-[32px] h-[4px] bg-white opacity-50 rounded-full"></div>

            <!-- Header Content -->
            <div class="absolute top-[20px] left-[16px] flex items-center gap-[8px]">
                <img src="assets/images/icon.png" class="w-[50px] h-[50px] rounded-[8px] shadow-sm flex-shrink-0" />
                <div>
                    <div class="text-[18px] font-extrabold text-white leading-tight tracking-wide">YPWI LUWU TIMUR</div>
                    <div class="text-[9px] font-medium text-sky-100 leading-tight">KARTU PENDIDIK & TENAGA KEPENDIDIKAN</div>
                </div>
            </div>
            </div>

            <!-- Profile Frame & Name -->
            <div class="px-[16px] pt-[16px] pb-[8px] flex items-start gap-[10px] flex-shrink-0">
                <div class="w-[76px] h-[96px] bg-slate-100 rounded-[10px] border-[2px] border-sky-100 overflow-hidden flex items-center justify-center flex-shrink-0">
                    <img src="${foto}" crossorigin="anonymous" class="w-full h-full object-cover" />
                </div>
                <div class="flex-1 min-w-0 pt-[8px]">
                    <div class="bg-sky-100 text-sky-700 px-[8px] h-[16px] rounded-full text-[7px] font-extrabold flex items-center justify-center tracking-widest leading-none whitespace-nowrap w-fit mb-[4px]">
                        ${(teacher.status_kepegawaian || 'GURU').toUpperCase()}
                    </div>
                    <div class="text-[13px] font-extrabold text-slate-900 leading-tight pb-[2px]">${teacher.nama || 'Guru'}</div>
                    <div class="text-[10px] font-bold text-blue-600 leading-tight">${teacher.jabatan_di_unit || '-'}</div>
                </div>
            </div>

            <!-- BAGIAN TENGAH: Diisi Data Rinci -->
            <div class="px-[16px] py-[8px] flex-shrink-0">
                <div class="bg-slate-50 border border-slate-200 rounded-[12px] p-[10px] box-border flex flex-col gap-[6px]">
                    <div class="flex justify-between w-full gap-[6px]">
                        <div class="flex-1 min-w-0 pr-1">
                            <div class="text-[7px] font-bold text-slate-400 uppercase tracking-wider mb-[2px]">NIY (NIP)</div>
                            <div class="text-[8px] font-extrabold text-slate-800 leading-none">${teacher.nip || '-'}</div>
                        </div>
                        <div class="flex-1 min-w-0 pl-1">
                            <div class="text-[7px] font-bold text-slate-400 uppercase tracking-wider mb-[2px]">NIK</div>
                            <div class="text-[8px] font-extrabold text-slate-800 leading-none">${teacher.nik || '-'}</div>
                        </div>
                    </div>
                    <div class="flex justify-between w-full gap-[6px]">
                        <div class="flex-1 min-w-0 pr-1">
                            <div class="text-[7px] font-bold text-slate-400 uppercase tracking-wider mb-[2px]">NAMA SEKOLAH</div>
                            <div class="text-[8px] font-extrabold text-slate-800 leading-none">${sekolahName.split('; ')[0]}</div>
                        </div>
                        <div class="flex-1 min-w-0 pl-1">
                            <div class="text-[7px] font-bold text-slate-400 uppercase tracking-wider mb-[2px]">TMT</div>
                            <div class="text-[8px] font-extrabold text-slate-800 leading-none">${formattedDate}</div>
                        </div>
                    </div>
                    <div class="flex justify-between w-full gap-[6px]">
                        <div class="flex-1 min-w-0 pr-1">
                            <div class="text-[7px] font-bold text-slate-400 uppercase tracking-wider mb-[2px]">SCAN ID</div>
                            <div class="text-[8px] font-extrabold text-slate-800 leading-none">${scanId}</div>
                        </div>
                        <div class="flex-1 min-w-0 pl-1">
                            <div class="text-[7px] font-bold text-slate-400 uppercase tracking-wider mb-[2px]">NO. TELP</div>
                            <div class="text-[8px] font-extrabold text-slate-800 leading-none">${noTelp}</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Spacer -->
            <div class="px-[16px] pb-[16px] pt-[8px] flex-shrink-0">
                <div class="w-full h-[72px] bg-sky-50 border-[1.5px] border-dashed border-sky-300 rounded-[12px] p-[8px] flex items-center gap-[10px] box-border">
                    <div class="w-[64px] h-[64px] bg-white border border-sky-200 rounded-[8px] flex items-center justify-center shrink-0 p-[2px]">
                        <img src="${qrUrl}" crossorigin="anonymous" class="w-full h-full object-contain rounded-[4px]" 
                             onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-[6px] font-bold text-slate-400 text-center\\'>QR<br>GAGAL</div>'" />
                    </div>
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="text-[8px] font-extrabold text-sky-800 leading-none mb-[4px]">📱 PRESENSI DIGITAL</div>
                        <div class="text-[6.5px] font-medium text-slate-600 leading-tight">Scan QR untuk verifikasi presensi & sistem akademik sekolah.</div>
                        <div class="text-[6.5px] font-bold text-slate-500 mt-[4px] leading-none">Valid s.d: ${formattedDate}</div>
                    </div>
                </div>
                <div class="text-[5.5px] font-medium text-slate-400 leading-tight mt-[4px] text-center">Kartu ini milik Yayasan Pesantren Wahdah Islamiyah Luwu Timur, bagi yang mendapatkan kartu ini silahkan menghubungi satuan pendidikan YPWI Lutim terdekat</div>
            </div>
        </div>
      `;
    }

    function loadTeachers() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      
      const apiURL = '/api/idcard/teachers';
      
      // Coba ambil dari API dulu
      fetch(apiURL, {
        headers: { 
          'Accept': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      })
        .then(response => {
          if (response.status === 401 || response.status === 403) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
            return;
          }
          if (!response.ok) throw new Error('API error');
          return response.json();
        })
        .then(result => {
          if (result.success && result.data && result.data.length > 0) {
            teachersData = result.data.map(t => ({
              id: t.id,
              nama: t.nama,
              jabatan_di_unit: t.jabatan_di_unit || '-',
              status_kepegawaian: t.status_kepegawaian || 'GURU',
              nip: t.nip || '-',
              nik: t.nik || '-',
              tmt: t.tmt || null,
              nama_sekolah: t.nama_sekolah || 'YPWI LUTIM',
              scan_id: t.scan_id || ('GURU-' + t.id),
              link_foto: t.link_foto || null,
              jenis_kelamin: t.jenis_kelamin || ''
            }));
            document.getElementById('totalCount').textContent = `Total: ${teachersData.length} guru`;
          } else {
            throw new Error('No data from API');
          }
          renderCards();
        })
        .catch(err => {
          console.warn('Gagal load dari API, gunakan data dummy:', err.message);
          // Fallback ke data dummy
          teachersData = [
            { id: 101, nama: 'Ahmad Dahlan, S.Pd', jabatan_di_unit: 'Guru Matematika', status_kepegawaian: 'Tetap', nip: '198501012010011001', nik: '7325010101850001', tmt: '2030-12-31', nama_sekolah: 'SMA YPWI LUTIM', scan_id: 'GURU-101', jenis_kelamin: 'L' },
            { id: 102, nama: 'Siti Nurhaliza, S.Si', jabatan_di_unit: 'Guru Fisika', status_kepegawaian: 'Kontrak', nip: '199002022015022002', nik: '7325010202900002', tmt: '2028-06-30', nama_sekolah: 'SMP YPWI LUTIM', scan_id: 'GURU-102', jenis_kelamin: 'P' },
            { id: 103, nama: 'Budi Santoso, M.Kom', jabatan_di_unit: 'Guru TIK', status_kepegawaian: 'Tetap', nip: '198201012015011003', nik: '7325010101820003', tmt: '2035-01-01', nama_sekolah: 'SMK YPWI LUTIM', scan_id: 'GURU-103', jenis_kelamin: 'L' }
          ];
          document.getElementById('totalCount').textContent = `Total: ${teachersData.length} guru`;
          renderCards();
        });
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      // Determine which teachers to show
      let displayTeachers = [];
      if (selectedIds.size > 0) {
        // Show only selected
        displayTeachers = teachersData.filter(t => selectedIds.has(t.id));
      } else if (filteredTeachers.length > 0) {
        // Show filtered (search results)
        displayTeachers = filteredTeachers;
      } else {
        // Show first 3 as preview
        displayTeachers = teachersData.slice(0, PREVIEW_LIMIT);
      }

      if (displayTeachers.length === 0) {
        container.innerHTML = '<div class="text-center p-8 text-gray-500 col-span-full">Tidak ada data guru</div>';
        return;
      }

      displayTeachers.forEach(t => {
        const cardBox = document.createElement('div');
        cardBox.className = 'relative flex flex-col items-center';
        const isChecked = selectedIds.has(t.id);
        cardBox.innerHTML = `
          <div class="card-preview-wrapper shadow-lg">
            ${generateCardHTML(t)}
          </div>
          <input type="checkbox" data-id="${t.id}" ${isChecked ? 'checked' : ''} class="card-check absolute top-3 left-3 w-5 h-5 rounded border-gray-300 text-indigo-600 cursor-pointer shadow" onchange="handleCheckboxChange(${t.id}, this.checked)">
          <button onclick="exportSinglePdfDirect(${t.id}, '${t.nama}')" class="absolute top-3 right-3 bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-1 rounded shadow" title="Unduh PDF"><i class="fas fa-file-pdf"></i></button>
        `;
        container.appendChild(cardBox);
      });

      updateShowAllButton();
    }

    function handleCheckboxChange(id, checked) {
      if (checked) {
        selectedIds.add(id);
      } else {
        selectedIds.delete(id);
      }
      renderCards();
    }

    function updateShowAllButton() {
      const btn = document.getElementById('showAllBtn');
      if (selectedIds.size > 0) {
        btn.textContent = `Terseleksi: ${selectedIds.size}`;
        btn.className = 'bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap';
      } else if (filteredTeachers.length > 0) {
        btn.textContent = `Hasil: ${filteredTeachers.length}`;
        btn.className = 'bg-blue-100 hover:bg-blue-200 text-blue-700 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap';
      } else {
        btn.textContent = teachersData.length > PREVIEW_LIMIT ? 'Tampilkan Semua' : 'Tutup';
        btn.className = 'bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap';
      }
    }

    function toggleShowAll() {
      if (selectedIds.size > 0) {
        selectedIds.clear();
      } else if (filteredTeachers.length > 0) {
        filteredTeachers = [];
        document.getElementById('searchInput').value = '';
      } else {
        filteredTeachers = [...teachersData];
      }
      renderCards();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      if (query) {
        filteredTeachers = teachersData.filter(t => t.nama.toLowerCase().includes(query));
        selectedIds.clear();
      } else {
        filteredTeachers = [];
      }
      renderCards();
    });

    // Export PDF Tunggal (Ukuran Pas CR80 Pas Fisik 54mm x 85mm)
    async function exportSinglePdfDirect(id, nama) {
      showLoading('Mengeksport PDF 1:1 Presisi...');

      // WAJIB: Menunggu font selesai diload agar teks tidak terpotong!
      await document.fonts.ready;

      const element = document.getElementById(`card-node-${id}`);
      if (!element) {
        alert('Elemen kartu tidak ditemukan.');
        hideLoading();
        return;
      }

      try {
        // html2canvas menangani rendering dengan resolusi 2x lipat (scale: 2 - cukup untuk PDF)
        const canvas = await html2canvas(element, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff'
        });

        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;

        // Buat PDF ukuran CR80 (ID Card Standar 54x85mm)
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [54, 85] });
        doc.addImage(imgData, 'PNG', 0, 0, 54, 85);
        doc.save(`idcard-${(nama || 'guru').toLowerCase().replace(/[^a-z0-9]/g, '-')}.pdf`);
      } catch (err) {
        console.error("Gagal export:", err);
        alert("Terjadi kesalahan saat mengeksport PDF: " + (err.message || 'Unknown error'));
      }

      hideLoading();
    }

    // Export Bulk PDF (Grid A4 Presisi, 9 kartu per halaman)
    async function processBulkExport(ids) {
      if (!ids.length) return alert('Pilih minimal satu kartu.');
      showLoading(`Mengeksport ${ids.length} Kartu ke PDF...`, `Mulai render ${ids.length} kartu...`);

      // WAJIB: Menunggu font
      await document.fonts.ready;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

      // Margin dan jarak antar kartu di kertas A4 (3 kolom x 3 baris = 9 kartu)
      const marginX = 15, marginY = 15, gapX = 5, gapY = 5;
      const cardW = 54, cardH = 85;

      try {
        for (let i = 0; i < ids.length; i++) {
          // Buat halaman baru jika sudah melebihi 9 kartu (3 kolom x 3 baris)
          if (i > 0 && i % 9 === 0) doc.addPage();

          const indexOnPage = i % 9;
          const col = indexOnPage % 3;
          const row = Math.floor(indexOnPage / 3);

          const x = marginX + col * (cardW + gapX);
          const y = marginY + row * (cardH + gapY);

          const el = document.getElementById(`card-node-${ids[i]}`);
          if (el) {
            // scale: 2 untuk kecepatan export (masih tajam untuk PDF)
            const canvas = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/png');
            doc.addImage(imgData, 'PNG', x, y, cardW, cardH);
          }

          // Update progress setiap kartu
          updateProgress(i + 1, ids.length);
        }
        doc.save('idcard-guru-bulk-presisi.pdf');
      } catch (err) {
        console.error("Gagal bulk export:", err);
        alert("Terjadi kesalahan saat proses bulk export: " + (err.message || 'Unknown error'));
      }

      hideLoading();
    }

    function exportSelectedPdf() {
      const selected = [...selectedIds];
      if (selected.length === 0) return alert('Pilih minimal satu kartu.');
      processBulkExport(selected);
    }

    function exportAllPdf() {
      const allIds = teachersData.map(t => t.id);
      processBulkExport(allIds);
    }

    // Init
    document.addEventListener('DOMContentLoaded', loadTeachers);
  </script>
