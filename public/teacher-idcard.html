<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ID Card Guru - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @page { size: auto; margin: 10mm; }
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
    .id-card {
      width: 5.5cm; height: 8.5cm; background: white; border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); overflow: hidden; position: relative;
      page-break-inside: avoid; border: 1px solid #e0e0e0;
    }
    .photo-frame { width: 42px; height: 54px; border: 2px solid #e5e7eb; border-radius: 3px; overflow: hidden; background: #f9fafb; }
    .photo-frame-large { width: 60px; height: 78px; border: 2px solid #e5e7eb; border-radius: 4px; overflow: hidden; background: #f9fafb; }
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .no-print { display: none !important; }
      .id-card { box-shadow: none; margin: 4mm; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-8">
    <div class="max-w-6xl mx-auto">
      <div class="flex justify-between items-center mb-6 no-print">
        <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-id-card text-green-600 mr-2"></i>ID Card Guru</h1>
        <div class="flex space-x-2">
          <button onclick="exportAllPdf()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg"><i class="fas fa-file-pdf mr-2"></i>Export PDF Semua</button>
          <button onclick="exportSelectedPdf()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg"><i class="fas fa-check-square mr-2"></i>Export PDF Terpilih</button>
          <button onclick="printCards()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg"><i class="fas fa-print mr-2"></i>Cetak</button>
          <button onclick="location.href='admin-dashboard.html'" class="bg-gray-600 hover:bg-gray-600 text-white px-4 py-2 rounded-lg"><i class="fas fa-arrow-left mr-2"></i>Kembali</button>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow p-4 mb-6 no-print">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sekolah</label>
            <select id="tenantFilter" class="w-full border-gray-300 rounded-lg px-3 py-2">
              <option value="">Semua Sekolah</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pencarian</label>
            <input type="text" id="searchInput" placeholder="Cari nama / NIK / NIP..." class="w-full border-gray-300 rounded-lg px-3 py-2">
          </div>
          <div class="flex items-end">
            <button onclick="loadTeachers()" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg"><i class="fas fa-search mr-2"></i>Tampilkan</button>
          </div>
        </div>
      </div>

      <div id="cardsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <div class="text-center p-4 text-gray-500 col-span-full">Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    let teachersData = [];
    const token = localStorage.getItem('token');

    async function loadTeachers() {
      const tenantId = document.getElementById('tenantFilter').value;
      const search = document.getElementById('searchInput').value;

      try {
        const response = await fetch('/api/idcard/teachers' + (tenantId ? '?tenant_id=' + tenantId : ''), {
          headers: { 'Authorization': token ? 'Bearer ' + token : '' }
        });
        const result = await response.json();

        if (result.success) {
          teachersData = result.data.filter(t =>
            !search || (t.nama && t.nama.toLowerCase().includes(search.toLowerCase())) ||
            (t.nik && t.nik.includes(search)) || (t.nip && t.nip.includes(search))
          );
          renderCards();
        } else {
          document.getElementById('cardsContainer').innerHTML = '<p class="text-red-600 p-4">Error: ' + (result.message || 'Tidak ada akses') + '</p>';
        }
      } catch (error) {
        document.getElementById('cardsContainer').innerHTML = '<p class="text-red-600 p-4">Error loading. Check console.</p>';
        console.error(error);
      }
    }

    async function loadTenants() {
      try {
        const response = await fetch('/api/tenants');
        const result = await response.json();
        if (result.success) {
          const select = document.getElementById('tenantFilter');
          result.data.forEach(tenant => {
            const option = document.createElement('option');
            option.value = tenant.tenant_id;
            option.textContent = tenant.nama_sekolah;
            select.appendChild(option);
          });
        }
      } catch (error) {}
    }

    function fotoUrl(teacher) {
      return teacher.link_foto || `https://ui-avatars.com/api/?name=${encodeURIComponent(teacher.nama || 'Guru')}&size=150&background=066e3a&color=fff`;
    }

    function renderCards() {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      teachersData.forEach(teacher => {
        const scanId = teacher.scan_id || teacher.id || '';
        const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=56x56&data=${encodeURIComponent(scanId)}`;
        const safeNama = (teacher.nama || 'Guru').replace(/'/g, '');

        const card = document.createElement('div');
        card.className = 'id-card';
        card.innerHTML = `
          <div class="text-center pt-1.5">
            <img src="/assets/images/YPWI%20LOGO%20FULL%20COLOR.png" alt="Logo YPWI" class="mx-auto h-4 w-auto" onerror="this.style.display='none'">
            <div class="text-[#066e3a] font-bold text-[10px] tracking-wider">YPWI LUTIM</div>
          </div>
          <div class="mt-2 flex justify-center">
            <div class="photo-frame-large">
              <img src="${fotoUrl(teacher)}" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=Guru&size=150&background=066e3a&color=fff'">
            </div>
          </div>
          <div class="font-bold text-center text-[11px] text-gray-800 mt-1.5 px-2">${teacher.nama || 'Guru'}</div>
          <div class="text-[7px] text-gray-500 text-center mt-0.5">${scanId}</div>
          <div class="text-[7px] text-[#044e24] font-semibold text-center mt-0.5 px-2">${teacher.jabatan_di_unit || 'Guru'}</div>
          <div class="mt-2 flex justify-center">
            <img src="${qrUrl}" class="w-14 h-14" alt="QR Scan">
          </div>
          <input type="checkbox" data-id="${teacher.id}" class="card-check absolute top-1 left-1 no-print w-3 h-3 rounded border-gray-400 text-indigo-600" title="Pilih kartu ini">
          <button onclick="exportSinglePdf(${teacher.id}, '${safeNama}')" class="absolute top-1 right-1 no-print bg-blue-600 hover:bg-blue-700 text-white text-xs px-1.5 py-0.5 rounded" title="Unduh PDF kartu ini"><i class="fas fa-file-pdf"></i></button>
        `;
        container.appendChild(card);
      });

      if (teachersData.length === 0) {
        container.innerHTML = '<p class="text-gray-400 p-4 col-span-full">Tidak ada data guru.</p>';
      }
    }

    async function exportAllPdf() {
      const tenantId = document.getElementById('tenantFilter').value;
      const url = '/api/idcard/teachers/pdf' + (tenantId ? '?tenant_id=' + tenantId : '');
      try {
        const response = await fetch(url, { headers: { 'Authorization': token ? 'Bearer ' + token : '' } });
        const blob = await fetchToBlob(response);
        const dl = document.createElement('a');
        dl.href = URL.createObjectURL(blob);
        dl.download = 'idcard-guru-bulk.pdf';
        dl.click();
      } catch (error) {
        console.error(error);
        alert('Gagal export PDF.');
      }
    }

    async function exportSelectedPdf() {
      const ids = [...document.querySelectorAll('.card-check:checked')].map((cb) => cb.dataset.id).join(',');
      if (!ids) return alert('Pilih minimal satu kartu.');
      try {
        const response = await fetch('/api/idcard/teachers/pdf?ids=' + ids, { headers: { 'Authorization': token ? 'Bearer ' + token : '' } });
        const blob = await fetchToBlob(response);
        const dl = document.createElement('a');
        dl.href = URL.createObjectURL(blob);
        dl.download = 'idcard-guru-terpilih.pdf';
        dl.click();
      } catch (error) {
        console.error(error);
        alert('Gagal export PDF terpilih.');
      }
    }

    async function fetchToBlob(response) {
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.message || ('Error ' + response.status));
      }
      return await response.blob();
    }

    async function exportSinglePdf(teacherId, nama) {
      try {
        const response = await fetch('/api/idcard/teachers/pdf?teacher_id=' + teacherId, {
          headers: { 'Authorization': token ? 'Bearer ' + token : '' }
        });
        const blob = await response.blob();
        const dl = document.createElement('a');
        dl.href = URL.createObjectURL(blob);
        dl.download = 'idcard-guru-' + (nama || teacherId) + '.pdf';
        dl.click();
      } catch (error) {
        console.error(error);
        alert('Gagal export PDF.');
      }
    }

    function printCards() { window.print(); }

    document.addEventListener('DOMContentLoaded', () => { loadTenants(); loadTeachers(); });
  </script>
</body>
</html>
