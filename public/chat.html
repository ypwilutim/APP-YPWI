<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Internal - YPWI Lutim</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body{font-family:system-ui,sans-serif;background:#f8fafc;margin:0;padding:0;height:100vh;display:flex;flex-direction:column}
.chat-header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;padding:1rem;display:flex;align-items:center;gap:0.75rem}
.chat-header h1{margin:0;font-size:1.25rem;flex:1}
.chat-header .header-btn{background:rgba(255,255,255,0.2);color:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer}
.content{flex:1;display:flex;overflow:hidden}
.conversations-list{width:280px;background:white;border-right:1px solid #e2e8f0;overflow-y:auto}
.conversations-list-header{padding:0.75rem;border-bottom:1px solid #e2e8f0}
.conversations-list-header input{width:100%;padding:0.5rem;border:1px solid #cbd5e1;border-radius:0.5rem;font-size:0.9rem}
.conversation-item{padding:0.75rem 1rem;border-bottom:1px solid #f1f5f9;cursor:pointer;display:flex;align-items:center;gap:0.5rem}
.conversation-item:hover{background:#f8fafc}
.conversation-item.selected{background:#eff6ff}
.conversation-item input[type="checkbox"]{width:18px;height:18px;display:none}
body.delete-mode .conversation-item input[type="checkbox"]{display:block}
.chat-header .delete-btn{display:none;background:#dc2626;color:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer}
body.delete-mode .chat-header .delete-btn{display:block}
.conversation-name{font-weight:600;font-size:0.95rem;flex:1}
.conversation-preview{font-size:0.8rem;color:#64748b;margin-top:0.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delete-actions{display:none;padding:0.5rem;background:#fef2f2;border-top:1px solid #e2e8f0;align-items:center;gap:0.5rem}
.delete-actions button{background:#64748b;color:white;border:none;padding:0.5rem 1rem;border-radius:0.25rem}
.chat-panel{flex:1;display:none;flex-direction:column}
.chat-panel.active{display:flex}
.chat-panel-header{background:#f8fafc;padding:0.75rem 1rem;border-bottom:1px solid #e2e8f0;font-weight:600}
#messagesContainer{flex:1;overflow-y:auto;padding:1rem;background:#f0f4f8}
.message{padding:0.5rem 0.75rem;margin-bottom:0.5rem;border-radius:0.75rem;max-width:70%;word-wrap:break-word}
.message.own{margin-left:auto;background:#2563eb;color:white;border-top-right-radius:0}
.message.other{margin-right:auto;background:white;color:#0f172a;border-top-left-radius:0}
.message-input-container{display:flex;gap:0.5rem;padding:0.75rem;background:white;border-top:1px solid #e2e8f0}
#messageInput{flex:1;padding:0.75rem;border:1px solid #cbd5e1;border-radius:0.5rem;outline:none}
#sendBtn{padding:0.75rem 1rem;background:#2563eb;color:white;border:none;border-radius:0.5rem;cursor:pointer}
.back-btn{background:rgba(255,255,255,0.2);color:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer}
.mobile-back{display:none}
@media (max-width:768px){.conversations-list{width:100%}.conversations-list.hide{transform:translateX(-100%)}.chat-panel{position:absolute;top:56px;right:0;width:100%;height:calc(100vh - 56px);background:white;z-index:10}.mobile-back{display:block}}
</style>
</head>
<body>
<div class="chat-header">
<button class="back-btn mobile-back" onclick="showConversations()"><i class="fas fa-arrow-left"></i></button>
<h1><i class="fas fa-comments"></i> Chat</h1>
<button class="header-btn" onclick="showSearch()"><i class="fas fa-plus"></i></button>
<button class="header-btn delete-btn" onclick="deleteSelected()"><i class="fas fa-trash"></i></button>
</div>
<div class="content">
<div class="conversations-list" id="conversationsList">
<div class="conversations-list-header"><input type="text" id="searchInput" placeholder="Cari history percakapan..." oninput="handleSearch()"></div>
<div class="delete-actions" id="deleteActions" style="display:none"><button onclick="cancelDelete()" style="background:#64748b;color:white;border:none;padding:0.5rem 1rem;border-radius:0.25rem;">Batal</button><span id="selectedCount">0 terpilih</span></div>
<div id="conversationsContainer"></div>
</div>
<div class="chat-panel" id="chatPanel">
<div class="chat-panel-header" id="chatPanelHeader">Chat</div>
<div id="messagesContainer"></div>
<div class="message-input-container"><input type="text" id="messageInput" placeholder="Ketik pesan..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMessage()"><button id="sendBtn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
(function() {
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = 'login.html';
    return;
  }
  const currentUserId = (function() {
    try {
      const b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(b)).id;
    } catch (e) {
      return null;
    }
  })();

  function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
  }

  function jsStringEscape(t) {
    return String(t).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  function authedFetch(u, i) {
    i = i || {};
    i.headers = Object.assign({}, i.headers, { Authorization: 'Bearer ' + token });
    return fetch(u, i);
  }

  let activeConversationId = null,
      searchMode = 'filter',
      allConversations = [],
      deleteMode = false,
      longPressTimer = null;

  async function loadConversations() {
    try {
      const r = await authedFetch('/api/chat/conversations');
      const d = await r.json();
      if (d.success && d.conversations && d.conversations.length) {
        allConversations = d.conversations;
        renderConversations(d.conversations);
      } else {
        document.getElementById('conversationsContainer').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:2rem;">Belum ada percakapan</div>';
      }
    } catch (e) {
      document.getElementById('conversationsContainer').innerHTML = '<div style="text-align:center;color:#dc2626;padding:1rem;">Error</div>';
    }
  }

  function handleSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q && searchMode === 'filter') {
      loadConversations();
      return;
    }
    if (searchMode === 'new') {
      searchNewUser();
    } else {
      const f = allConversations.filter(c => (c.other_name || '').toLowerCase().includes(q.toLowerCase()));
      renderConversations(f);
    }
  }

  function showSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('searchInput').placeholder = 'Cari nama yang ingin di-chat...';
    document.getElementById('searchInput').focus();
    searchMode = 'new';
    document.getElementById('conversationsContainer').innerHTML = '';
  }

  async function searchNewUser() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    try {
      const r = await authedFetch('/api/chat/users?search=' + encodeURIComponent(q));
      const d = await r.json();
      if (d.success && d.users) {
        document.getElementById('conversationsContainer').innerHTML = d.users.map(u =>
          '<div class="conversation-item" onclick="checkExisting('+u.user_id+",'"+jsStringEscape(u.name)+"')\"><div class='conversation-name'>"+escapeHtml(u.name)+'</div><div class="conversation-preview">Guru - ' + u.tenant_id + '</div></div>'
        ).join('');
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function checkExisting(id, n) {
    const e = allConversations.find(c => c.other_name === n);
    if (e) openConversation(e.id, n);
    else selectUser(id, n);
  }

  async function selectUser(id, n) {
    try {
      const r = await authedFetch('/api/chat/conversations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetUserId: id, targetUserType: 'guru' })
      });
      const d = await r.json();
      if (d.success) {
        activeConversationId = d.conversationId;
        document.getElementById('chatPanelHeader').textContent = n;
        document.getElementById('chatPanel').classList.add('active');
        document.getElementById('searchInput').value = '';
        document.getElementById('conversationsList').classList.add('hide');
        document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:2rem;"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>';
      } else {
        Swal.fire('Error', d.message, 'error');
      }
    } catch (e) {
      console.error(e);
    }
  }

  function openConversation(c, n) {
    if (deleteMode) return;
    activeConversationId = c;
    document.getElementById('chatPanelHeader').textContent = n || 'Chat';
    document.getElementById('chatPanel').classList.add('active');
    document.getElementById('conversationsList').classList.add('hide');
    document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;color:#94a3b8;padding:2rem;"><i class="fas fa-spinner fa-spin"></i> Memuat...</div>';
    loadMessages();
  }

  function showConversations() {
    document.getElementById('chatPanel').classList.remove('active');
    document.getElementById('conversationsList').classList.remove('hide');
    if (deleteMode) {
      cancelDelete();
    } else {
      searchMode = 'filter';
      document.getElementById('searchInput').value = '';
      document.getElementById('searchInput').placeholder = 'Cari history percakapan...';
      handleSearch();
    }
  }

  async function loadMessages() {
    if (!activeConversationId) return;
    try {
      const r = await authedFetch('/api/chat/conversations/' + activeConversationId + '/messages');
      const d = await r.json();
      if (d.success) {
        document.getElementById('messagesContainer').innerHTML = d.messages && d.messages.length
          ? d.messages.map(m => '<div class="message ' + (m.sender_id == currentUserId ? 'own' : 'other') + '"><div>' + escapeHtml(m.message) + '</div><div style="font-size:0.7rem;opacity:0.7;margin-top:0.25rem;">' + new Date(m.created_at).toLocaleTimeString('id-ID') + '</div></div>').join('')
          : '<div style="text-align:center;color:#64748b;padding:2rem;">Belum ada pesan</div>';
        document.getElementById('messagesContainer').scrollTop = document.getElementById('messagesContainer').scrollHeight;
      } else {
        document.getElementById('messagesContainer').innerHTML = '<div style="text-align:center;color:#dc2626;padding:1rem;">' + escapeHtml(d.message || 'Gagal memuat pesan') + '</div>';
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function sendMessage() {
    const i = document.getElementById('messageInput');
    const m = i.value.trim();
    if (!m || !activeConversationId) return;
    try {
      const r = await authedFetch('/api/chat/conversations/' + activeConversationId + '/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: m })
      });
      const d = await r.json();
      if (d.success) {
        i.value = '';
        loadMessages();
        loadConversations();
      }
    } catch (e) {
      console.error(e);
    }
  }

  function renderConversations(c) {
    document.getElementById('conversationsContainer').innerHTML = c.length
      ? c.map(v =>
          '<div class="conversation-item" onclick="openConversation(' + v.id + ",'" + jsStringEscape(v.other_name) + "')\"><input type=\"checkbox\" class=\"conv-checkbox\" onchange=\"updateSelectedCount()\" value=\"" + v.id + "\"><div><div class=\"conversation-name\">" + escapeHtml(v.other_name || 'Percakapan') + '</div><div class="conversation-preview">' + escapeHtml(v.last_message || 'Belum ada pesan') + '</div></div></div>'
        ).join('')
      : '<div style="text-align:center;color:#94a3b8;padding:1rem;">Tidak ada percakapan ditemukan</div>';
  }

  document.addEventListener('touchstart', e => {
    if (e.target.closest('.conversation-item') && !deleteMode) {
      longPressTimer = setTimeout(() => {
        enterDeleteMode();
        const cb = e.target.closest('.conversation-item').querySelector('.conv-checkbox');
        if (cb) {
          cb.checked = true;
          updateSelectedCount();
        }
      }, 500);
    }
  }, { passive: true });
  document.addEventListener('touchmove', () => {
    clearTimeout(longPressTimer);
  }, { passive: true });
  document.addEventListener('touchend', () => {
    clearTimeout(longPressTimer);
  });
  document.addEventListener('touchcancel', () => {
    clearTimeout(longPressTimer);
  });

  function enterDeleteMode() {
    deleteMode = true;
    document.body.classList.add('delete-mode');
    document.getElementById('deleteActions').style.display = 'flex';
  }

  function cancelDelete() {
    deleteMode = false;
    document.body.classList.remove('delete-mode');
    document.getElementById('deleteActions').style.display = 'none';
    document.querySelectorAll('.conv-checkbox').forEach(cb => cb.checked = false);
  }

  function updateSelectedCount() {
    document.getElementById('selectedCount').textContent = document.querySelectorAll('.conv-checkbox:checked').length + ' terpilih';
  }

  async function deleteSelected() {
    const c = document.querySelectorAll('.conv-checkbox:checked');
    if (!c.length) return;
    await Promise.all(Array.from(c).map(cb => authedFetch('/api/chat/conversations/' + cb.value, { method: 'DELETE' })));
    cancelDelete();
    loadConversations();
  }

  loadConversations();
  setInterval(loadConversations, 10000);
})();
</script>
</body>
</html>
