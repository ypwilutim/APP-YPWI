<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Orang Tua - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
  <link rel="icon" href="assets/images/YPWI LOGO HITAM.png" type="image/png">
  <style>
    body {
      background: linear-gradient(135deg, #066e3a 0%, #043d20 100%);
      min-height: 100vh;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-5px);
      }
    }

    .float-animation {
      animation: float 4s ease-in-out infinite;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xl w-full mx-auto px-4">
    <div class="glass-card rounded-3xl shadow-2xl p-8 sm:p-10 border border-gray-100">
      <div class="text-center mb-8 float-animation">
        <div
          class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-white flex items-center justify-center shadow-lg p-2 border border-gray-100">
          <img src="assets/images/YPWI LOGO HITAM.png" alt="YPWI Logo" class="w-full h-full object-contain">
        </div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900">Login Orang Tua</h1>
        <p class="text-gray-600 mt-2 text-base sm:text-lg">Akses Informasi Anak Anda</p>
      </div>

      <div>
        <form id="parentLoginForm" method="POST" novalidate>
          <div class="mb-6">
            <label for="phoneNumber" class="block text-sm font-semibold text-gray-700 mb-2">Nomor WhatsApp Orang
              Tua</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i class="fas fa-whatsapp text-green-600 text-lg"></i>
              </div>
              <input type="tel" id="phoneNumber" name="phoneNumber"
                class="w-full pl-12 pr-4 py-3.5 rounded-xl border-2 border-gray-200 bg-gray-50 focus:bg-white focus:border-green-600 focus:ring-2 focus:ring-green-600/20 outline-none transition font-medium text-gray-800"
                placeholder="Contoh: 6281234567890" required>
            </div>
            <p class="text-red-500 text-sm mt-1 hidden" id="phoneError">Nomor WhatsApp harus diisi</p>
          </div>

          <button type="submit" id="parentLoginBtn"
            class="w-full bg-[#066e3a] hover:bg-[#05572e] text-white font-bold py-3.5 px-8 rounded-xl text-lg flex items-center justify-center gap-3 shadow-lg transform hover:-translate-y-0.5 transition duration-200">
            <i class="fas fa-sign-in-alt"></i>
            Masuk
          </button>

          <div id="loadingSpinner" class="hidden text-center py-4">
            <div
              class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-green-600 border-t-transparent mb-2">
            </div>
            <p class="text-gray-600 text-sm">Sedang memproses...</p>
          </div>
        </form>

        <div class="mt-8 text-center">
          <div class="border-t border-gray-200 pt-5">
            <p class="text-sm text-gray-600 mb-3">Butuh bantuan?</p>
            <a href="https://wa.me/6282396859771" target="_blank"
              class="inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-5 rounded-xl text-sm shadow transition">
              <i class="fab fa-whatsapp text-lg"></i>
              Hubungi Admin via WhatsApp
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script>
  document.getElementById('parentLoginForm').addEventListener('submit', async function (e) {
    // 1. Cegah form melakukan reload/submit default ke URL halaman itu sendiri
    e.preventDefault();

    const phoneNumber = document.getElementById('phoneNumber').value.trim();
    const phoneError = document.getElementById('phoneError');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const loginBtn = document.getElementById('parentLoginBtn');

    // Validasi sederhana
    if (!phoneNumber) {
      phoneError.classList.remove('hidden');
      return;
    }
    phoneError.classList.add('hidden');

    // Tampilkan loading, sembunyikan tombol
    loadingSpinner.classList.remove('hidden');
    loginBtn.classList.add('hidden');

    try {
      // 2. Kirim data nomor HP ke endpoint backend API Anda
      // Sesuaikan URL '/api/parent/login' dengan rute backend yang sudah dibuat AI coding
      const response = await fetch('/api/parent/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ phoneNumber: phoneNumber })
      });

      const result = await response.json();

      if (response.ok && result.token) {
        localStorage.setItem('parentToken', result.token);
        localStorage.setItem('parentData', JSON.stringify(result.parent || {}));
        window.location.href = '/anakku-portal.html';
      } else {
        alert(result.message || 'Nomor WhatsApp tidak terdaftar sebagai orang tua.');
        loadingSpinner.classList.add('hidden');
        loginBtn.classList.remove('hidden');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('Terjadi kesalahan pada server. Silakan coba lagi.');
      loadingSpinner.classList.add('hidden');
      loginBtn.classList.remove('hidden');
    }
  });
</script>

</html>
