<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran SPMB - Penerimaan Siswa</title>
  <link rel="stylesheet" href="/SPMB/css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .step { display: none; }
    .step.active { display: block; }
    .step-indicator { transition: all 0.3s ease; }
    .step-indicator.active { background: #2563eb; color: white; }
    .step-indicator.completed { background: #10b981; color: white; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased py-8">
  <div class="max-w-3xl mx-auto px-4">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-900 mb-2">Pendaftaran SPMB</h1>
      <p class="text-slate-600">Lengkapi data untuk mendaftar sebagai panitia penerimaan siswa baru</p>
    </div>

    <div class="flex justify-between mb-8">
      <div class="step-indicator active w-10 h-10 rounded-full flex items-center justify-center font-bold" data-step="1">1</div>
      <div class="step-indicator w-10 h-10 rounded-full flex items-center justify-center font-bold bg-slate-200" data-step="2">2</div>
      <div class="step-indicator w-10 h-10 rounded-full flex items-center justify-center font-bold bg-slate-200" data-step="3">3</div>
    </div>

    <form id="spmbRegistrationForm">
      <!-- Step 1: Data Pribadi -->
      <div class="step active bg-white rounded-xl shadow-sm p-6 mb-6" data-step="1">
        <h2 class="text-xl font-semibold mb-4">Data Pribadi</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap *</label>
            <input type="text" id="nama" name="nama" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">NIK *</label>
            <input type="text" id="nik" name="nik" required maxlength="16" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
            <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">No WhatsApp *</label>
            <input type="tel" id="no_wa" name="no_wa" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tempat Lahir *</label>
            <input type="text" id="tempat_lahir" name="tempat_lahir" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tanggal Lahir *</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Kelamin *</label>
            <select id="jenis_kelamin" name="jenis_kelamin" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
              <option value="">Pilih</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Alamat Lengkap *</label>
            <textarea id="alamat" name="alamat" rows="3" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20"></textarea>
          </div>
        </div>
        <div class="flex justify-end mt-6">
          <button type="button" onclick="nextStep(2)" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700">Selanjutnya</button>
        </div>
      </div>

      <!-- Step 2: Data Pendidikan & Assignment -->
      <div class="step bg-white rounded-xl shadow-sm p-6 mb-6" data-step="2">
        <h2 class="text-xl font-semibold mb-4">Data Pendidikan & Penempatan</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Pendidikan Terakhir *</label>
            <select id="pendidikan_terakhir" name="pendidikan_terakhir" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
              <option value="">Pilih</option>
              <option value="SMA">SMA/SMK</option>
              <option value="D3">D3</option>
              <option value="D4">D4</option>
              <option value="S1">S1</option>
              <option value="S2">S2</option>
              <option value="S3">S3</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Jurusan *</label>
            <input type="text" id="jurusan" name="jurusan" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Sekolah Pendidikan *</label>
            <input type="text" id="nama_sekolah_pendidikan" name="nama_sekolah_pendidikan" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Tahun Angkatan *</label>
            <input type="text" id="tahun_angkatan" name="tahun_angkatan" required placeholder="2024" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Sekolah Penempatan *</label>
            <select id="tenant_id" name="tenant_id" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
              <option value="">Pilih Sekolah</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Jabatan di Unit *</label>
            <select id="jabatan_di_unit" name="jabatan_di_unit" required class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20">
              <option value="">Pilih</option>
              <option value="Ketua">Ketua</option>
              <option value="Pimpinan">Pimpinan</option>
              <option value="Pimpinan Pondok">Pimpinan Pondok</option>
              <option value="Kepala Sekolah">Kepala Sekolah</option>
              <option value="Wakasek">Wakasek</option>
              <option value="Guru">Guru</option>
              <option value="Guru Mapel">Guru Mapel</option>
              <option value="Guru Mengaji">Guru Mengaji</option>
              <option value="Wali Kelas">Wali Kelas</option>
              <option value="Muhaffiz">Muhaffiz</option>
              <option value="Muhaffizah">Muhaffizah</option>
              <option value="Bendahara">Bendahara</option>
              <option value="TU">TU</option>
              <option value="Tata Usaha">Tata Usaha</option>
              <option value="Operator">Operator</option>
              <option value="Admin">Admin</option>
              <option value="Media">Media</option>
              <option value="Security">Security</option>
              <option value="Cleaning Service">Cleaning Service</option>
              <option value="Bag. Dapur">Bag. Dapur</option>
              <option value="Bag. Kantin">Bag. Kantin</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password *</label>
            <input type="password" id="password" name="password" required minlength="6" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500/20" placeholder="Minimal 6 karakter">
          </div>
        </div>
        <div class="flex justify-between mt-6">
          <button type="button" onclick="prevStep(1)" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-xl hover:bg-slate-300">Kembali</button>
          <button type="button" onclick="nextStep(3)" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl hover:bg-blue-700">Selanjutnya</button>
        </div>
      </div>

      <!-- Step 3: Upload Berkas -->
      <div class="step bg-white rounded-xl shadow-sm p-6 mb-6" data-step="3">
        <h2 class="text-xl font-semibold mb-4">Upload Berkas</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Pas Foto *</label>
            <input type="file" id="foto" name="foto" accept="image/*" required class="w-full px-4 py-2 border border-slate-300 rounded-xl">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">KTP *</label>
            <input type="file" id="ktp" name="ktp" accept="image/*,.pdf" required class="w-full px-4 py-2 border border-slate-300 rounded-xl">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">KK *</label>
            <input type="file" id="kk" name="kk" accept="image/*,.pdf" required class="w-full px-4 py-2 border border-slate-300 rounded-xl">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Ijazah Terakhir *</label>
            <input type="file" id="ijazah" name="ijazah" accept="image/*,.pdf" required class="w-full px-4 py-2 border border-slate-300 rounded-xl">
          </div>
        </div>
        <div class="flex justify-between mt-6">
          <button type="button" onclick="prevStep(2)" class="px-6 py-2 bg-slate-200 text-slate-700 rounded-xl hover:bg-slate-300">Kembali</button>
          <button type="submit" class="px-6 py-2.5 bg-green-600 text-white rounded-xl hover:bg-green-700">Kirim Pendaftaran</button>
        </div>
      </div>
    </form>

    <div class="text-center mt-6">
      <p class="text-sm text-slate-600">
        Sudah punya akun? 
        <a href="/SPMB/spmb-login.html" class="text-blue-600 hover:text-blue-700 font-medium">Login di sini</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    let currentStep = 1;
    const totalSteps = 3;
    const STORAGE_KEY = 'spmb_pendaftaran_draft';

    function saveDraft() {
      const form = document.getElementById('spmbRegistrationForm');
      if (!form) return;
      const data = { step: currentStep, fields: {}, fileNames: {}, savedAt: new Date().toISOString() };
      const inputs = form.querySelectorAll('input, select, textarea');
      inputs.forEach(input => {
        if (input.type === 'file') {
          if (input.files && input.files[0]) data.fileNames[input.id] = input.files[0].name;
        } else if (input.id && !input.readOnly) data.fields[input.id] = input.value;
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { console.error('Failed to save draft:', e); }
    }

    function loadDraft() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const data = JSON.parse(saved);
        if (!data || !data.fields) return;
        Object.keys(data.fields).forEach(id => { const el = document.getElementById(id); if (el && data.fields[id]) el.value = data.fields[id]; });
        if (data.fileNames) Object.keys(data.fileNames).forEach(id => { const el = document.getElementById(id); if (el && el.parentElement) { const note = document.createElement('p'); note.className = 'text-xs text-slate-500 mt-1'; note.textContent = 'File sebelumnya: ' + data.fileNames[id] + ' (perlu diupload ulang)'; note.id = id + '_draft_note'; if (!el.parentElement.querySelector('#' + id + '_draft_note')) el.parentElement.appendChild(note); } });
        if (data.step && data.step > 1) showStep(data.step);
      } catch (e) { console.error('Failed to load draft:', e); }
    }

    function clearDraft() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }

    function showStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.querySelector(`.step[data-step="${step}"]`).classList.add('active');
      document.querySelectorAll('.step-indicator').forEach(ind => {
        ind.classList.remove('active', 'completed');
        if (parseInt(ind.dataset.step) < step) ind.classList.add('completed');
        if (parseInt(ind.dataset.step) === step) ind.classList.add('active');
      });
      currentStep = step;
      saveDraft();
    }

    function nextStep(step) {
      const stepEl = document.querySelector(`.step[data-step="${currentStep}"]`);
      const required = stepEl.querySelectorAll('[required]');
      let valid = true;
      required.forEach(field => { if (!field.value.trim()) { valid = false; field.classList.add('border-red-500'); } else field.classList.remove('border-red-500'); });
      if (!valid) { Swal.fire('Error', 'Mohon lengkapi semua field yang wajib diisi', 'error'); return; }
      showStep(step);
    }

    function prevStep(step) { showStep(step); }

    async function loadTenants() {
      try {
        const res = await fetch('/api/public/tenants');
        const data = await res.json();
        if (data.success && data.data) {
          const select = document.getElementById('tenant_id');
          data.data.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.tenant_id;
            opt.textContent = t.nama_sekolah;
            select.appendChild(opt);
          });
        }
      } catch (e) {
        console.error('Failed to load tenants:', e);
      }
    }

    document.getElementById('spmbRegistrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateStep(3)) return;

      const formData = new FormData();
      formData.append('nama', document.getElementById('nama').value);
      formData.append('nik', document.getElementById('nik').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('no_wa', document.getElementById('no_wa').value);
      formData.append('tempat_lahir', document.getElementById('tempat_lahir').value);
      formData.append('tanggal_lahir', document.getElementById('tanggal_lahir').value);
      formData.append('jenis_kelamin', document.getElementById('jenis_kelamin').value);
      formData.append('alamat', document.getElementById('alamat').value);
      formData.append('pendidikan_terakhir', document.getElementById('pendidikan_terakhir').value);
      formData.append('jurusan', document.getElementById('jurusan').value);
      formData.append('nama_sekolah_pendidikan', document.getElementById('nama_sekolah_pendidikan').value);
      formData.append('tahun_angkatan', document.getElementById('tahun_angkatan').value);
      formData.append('tenant_id', document.getElementById('tenant_id').value);
      formData.append('jabatan_di_unit', document.getElementById('jabatan_di_unit').value);
      formData.append('password', document.getElementById('password').value);
      formData.append('foto', document.getElementById('foto').files[0]);
      formData.append('ktp', document.getElementById('ktp').files[0]);
      formData.append('kk', document.getElementById('kk').files[0]);
      formData.append('ijazah', document.getElementById('ijazah').files[0]);

      try {
        const response = await fetch('/api/spmb/register', {
          method: 'POST',
          body: formData,
        });

        if (!response.ok) throw new Error(`Server error: ${response.status}`);

        const data = await response.json();

        if (data.success) {
          clearDraft();
          Swal.fire({ title: 'Pendaftaran Berhasil!', text: 'Pendaftaran panitia SPMB telah dikirim. Menunggu persetujuan admin.', icon: 'success', timer: 2000, showConfirmButton: false }).then(() => {
            window.location.href = '/SPMB/spmb-login.html';
          });
        } else {
          Swal.fire('Pendaftaran Gagal', data.message || 'Terjadi kesalahan', 'error');
        }
      } catch (error) {
        console.error('SPMB Registration error:', error);
        Swal.fire('Kesalahan', 'Tidak dapat terhubung ke server', 'error');
      }
    });

    function validateStep(step) {
      const stepEl = document.querySelector(`.step[data-step="${step}"]`);
      const required = stepEl.querySelectorAll('[required]');
      let valid = true;
      required.forEach(field => { if (!field.value.trim()) { valid = false; field.classList.add('border-red-500'); } else field.classList.remove('border-red-500'); });
      if (!valid) Swal.fire('Error', 'Mohon lengkapi semua field yang wajib diisi', 'error');
      return valid;
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadDraft();
      loadTenants();
    });
  </script>
</body>
</html>
