<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flyer SPMB</title>
  <link rel="stylesheet" href="/SPMB/css/tailwind.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .flyer-shell {
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <div class="min-h-screen flex flex-col">
    <header class="bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-50">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
        <div>
          <h1 id="flyerTitle" class="text-xl font-semibold text-slate-900">Flyer SPMB</h1>
          <p id="flyerMeta" class="text-sm text-slate-500 mt-1"></p>
        </div>
        <div class="flex gap-2">
          <a id="flyerPublicLink" href="#" class="inline-flex items-center px-3 py-2 bg-white text-slate-700 border border-slate-200 rounded-xl hover:border-blue-500 hover:text-blue-600 transition text-sm">
            <i class="fas fa-globe mr-2"></i>Halaman Publik
          </a>
          <a href="/SPMB/spmb-login.html" class="inline-flex items-center px-3 py-2 bg-slate-900 text-white rounded-xl hover:bg-slate-800 transition text-sm">
            <i class="fas fa-sign-in-alt mr-2"></i>Login
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div id="flyerContent" class="flyer-shell rounded-2xl p-6 sm:p-8">
        <p class="text-slate-500">Memuat flyer...</p>
      </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto">
      <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
        <p id="footerText" class="text-center text-sm text-slate-500">&copy; 2024 YPWI. All rights reserved.</p>
      </div>
    </footer>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tenantId = urlParams.get('tenant');

    const publicLink = document.getElementById('flyerPublicLink');
    if (publicLink && tenantId) {
      publicLink.href = '/SPMB/spmb-public.html?tenant=' + encodeURIComponent(tenantId);
    }

    async function loadFlyer() {
      if (!tenantId) {
        document.getElementById('flyerContent').innerHTML = '<p class="text-red-600">Parameter tenant tidak ditemukan.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/spmb/landing/${encodeURIComponent(tenantId)}`);
        const data = await res.json();

        if (data.success && data.data) {
          const config = data.data.config || {};
          const school = data.data.school || {};

          document.getElementById('flyerTitle').textContent = config.judul_flyer || 'Flyer SPMB';
          document.getElementById('flyerMeta').textContent = school.name ? 'Penerimaan siswa baru - ' + school.name : '';

          document.getElementById('flyerContent').innerHTML = `
            <div class="prose max-w-none text-slate-800">
              ${config.keterangan_flyer ? `<div class="whitespace-pre-wrap">${config.keterangan_flyer}</div>` : '<p class="text-slate-500">Belum ada konten flyer.</p>'}
            </div>
          `;
        }
      } catch (e) {
        console.error('[FLYER]', e);
        document.getElementById('flyerContent').innerHTML = '<p class="text-red-600">Gagal memuat flyer.</p>';
      }
    }

    loadFlyer();
  </script>
</body>
</html>
