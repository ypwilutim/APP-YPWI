<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard SPMB</title>
  <link rel="stylesheet" href="/SPMB/css/tailwind.css">
  <link rel="stylesheet" href="/SPMB/css/spmb-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="spmb-page min-h-screen flex flex-col">
  <header class="spmb-header">
    <div class="spmb-container spmb-header-inner">
      <a href="/SPMB/spmb-public.html" class="spmb-logo">
        <div class="spmb-logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <span>SPMB</span>
      </a>
      <div class="spmb-user-menu">
        <div class="spmb-user-avatar" id="userAvatar"></div>
        <span id="userName" class="spmb-font-medium text-slate-700 hidden sm:block">Memuat...</span>
        <button onclick="logout()" class="spmb-btn spmb-btn-ghost spmb-btn-sm">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </div>
  </header>

  <main class="spmb-container spmb-flex-1 spmb-py-8">
    <div class="spmb-flex spmb-items-center spmb-justify-between spmb-mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Dashboard Panitia</h1>
        <p class="spmb-text-muted spmb-mt-1">Kelola aktivitas panitia SPMB Anda</p>
      </div>
    </div>

    <div class="spmb-flex spmb-flex-wrap spmb-gap-4 spmb-mb-6" id="statsGrid">
      <div class="spmb-card spmb-flex-1 spmb-min-w-[150px] spmb-p-6">
        <div class="spmb-flex spmb-items-center spmb-justify-between">
          <div>
            <p class="spmb-text-sm spmb-text-muted">Panitia Saya</p>
            <p id="activeCommittees" class="text-2xl font-bold text-slate-900 spmb-mt-1">-</p>
          </div>
          <div class="spmb-p-3 spmb-rounded-lg" style="background: var(--spmb-primary-light); color: var(--spmb-primary);">
            <i class="fa-solid fa-users text-xl"></i>
          </div>
        </div>
      </div>
      <div class="spmb-card spmb-flex-1 spmb-min-w-[150px] spmb-p-6">
        <div class="spmb-flex spmb-items-center spmb-justify-between">
          <div>
            <p class="spmb-text-sm spmb-text-muted">Jabatan</p>
            <p id="userRole" class="text-2xl font-bold text-slate-900 spmb-mt-1">-</p>
          </div>
          <div class="spmb-p-3 spmb-rounded-lg" style="background: #dcfce7; color: var(--spmb-success);">
            <i class="fa-solid fa-user-tag text-xl"></i>
          </div>
        </div>
      </div>
      <div class="spmb-card spmb-flex-1 spmb-min-w-[150px] spmb-p-6">
        <div class="spmb-flex spmb-items-center spmb-justify-between">
          <div>
            <p class="spmb-text-sm spmb-text-muted">Sekolah</p>
            <p id="userSchool" class="text-2xl font-bold text-slate-900 spmb-mt-1">-</p>
          </div>
          <div class="spmb-p-3 spmb-rounded-lg" style="background: #e0e7ff; color: var(--spmb-primary);">
            <i class="fa-solid fa-school text-xl"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="spmb-card spmb-p-6">
      <h3 class="text-lg font-semibold spmb-mb-4">Aksi Cepat</h3>
      <div class="spmb-flex spmb-flex-wrap spmb-gap-4">
        <a href="/SPMB/spmb-public.html" class="spmb-btn spmb-btn-secondary spmb-flex-1 spmb-min-w-[180px] spmb-flex-col spmb-items-center spmb-gap-2 spmb-py-6">
          <i class="fa-solid fa-eye text-2xl" style="color: var(--spmb-primary);"></i>
          <p class="spmb-font-medium" style="color: var(--spmb-primary);">Lihat Halaman Publik</p>
        </a>
        <a href="/SPMB/spmb-applicants.html" class="spmb-btn spmb-btn-secondary spmb-flex-1 spmb-min-w-[180px] spmb-flex-col spmb-items-center spmb-gap-2 spmb-py-6">
          <i class="fa-solid fa-user-group text-2xl" style="color: var(--spmb-success);"></i>
          <p class="spmb-font-medium" style="color: var(--spmb-success);">Kelola Pendaftar Siswa</p>
        </a>
        <a href="/SPMB/spmb-landing-manager.html" class="spmb-btn spmb-btn-secondary spmb-flex-1 spmb-min-w-[180px] spmb-flex-col spmb-items-center spmb-gap-2 spmb-py-6">
          <i class="fa-solid fa-palette text-2xl" style="color: var(--spmb-accent);"></i>
          <p class="spmb-font-medium" style="color: var(--spmb-accent);">Kelola Landing Page</p>
        </a>
      </div>
    </div>

    <div class="spmb-card spmb-p-6 spmb-mt-6">
      <h3 class="text-lg font-semibold spmb-mb-4">Profil Panitia</h3>
      <div class="spmb-flex spmb-flex-col sm:spmb-flex-row spmb-gap-6">
        <div class="spmb-flex-1">
          <div class="spmb-flex spmb-items-center spmb-gap-4 spmb-mb-4">
            <div id="userAvatarLarge" class="spmb-w-[80px] spmb-h-[80px] spmb-rounded-full spmb-flex spmb-items-center spmb-justify-center spmb-font-bold text-xl" style="background: var(--spmb-primary-light); color: var(--spmb-primary);"></div>
            <div>
              <h4 id="profileName" class="text-xl font-bold text-slate-900">-</h4>
              <p id="profileRole" class="spmb-text-muted">-</p>
            </div>
          </div>
          <div class="spmb-flex spmb-flex-wrap spmb-gap-2 spmb-text-sm spmb-text-muted">
            <div class="spmb-flex spmb-items-center spmb-gap-1"><i class="fa-solid fa-school"></i> <span id="profileSchool">-</span></div>
            <div class="spmb-flex spmb-items-center spmb-gap-1"><i class="fa-solid fa-user-tag"></i> <span id="profileJabatan">-</span></div>
            <div class="spmb-flex spmb-items-center spmb-gap-1"><i class="fa-solid fa-id-card"></i> <span id="profileTenant">-</span></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="spmb-footer">
    <div class="spmb-container">
      <p>&copy; <span id="year"></span> SPMB - Sistem Penerimaan Murid Baru. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tokenParam = urlParams.get('token');
    if (tokenParam) {
      localStorage.setItem('spmb_token', tokenParam);
      try {
        const payload = JSON.parse(atob(tokenParam.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        localStorage.setItem('spmb_user', JSON.stringify({
          nama: payload.username || payload.nama || 'Pengguna SPMB',
          tenant_id: payload.tenant_id || (payload.assignments && payload.assignments[0]?.tenant_id),
          tenant_name: payload.assignments && payload.assignments[0]?.nama_sekolah,
          jabatan_di_unit: payload.assignments && payload.assignments[0]?.jabatan_di_unit
        }));
      } catch (e) {}
    }
    const token = localStorage.getItem('spmb_token');
    const user = JSON.parse(localStorage.getItem('spmb_user') || '{}');

    if (!token) {
      window.location.href = '/SPMB/spmb-login.html';
    }

    function initAvatar(name, elementId) {
      const el = document.getElementById(elementId);
      if (el && name) {
        const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        el.textContent = initials;
      }
    }

    document.getElementById('userName').textContent = user.nama || 'Pengguna SPMB';
    document.getElementById('userRole').textContent = user.jabatan_di_unit || '-';
    document.getElementById('userSchool').textContent = user.tenant_name || user.tenant_id || '-';
    
    initAvatar(user.nama, 'userAvatar');
    initAvatar(user.nama, 'userAvatarLarge');
    document.getElementById('profileName').textContent = user.nama || '-';
    document.getElementById('profileRole').textContent = user.jabatan_di_unit || '-';
    document.getElementById('profileSchool').textContent = user.tenant_name || user.tenant_id || '-';
    document.getElementById('profileJabatan').textContent = user.jabatan_di_unit || '-';
    document.getElementById('profileTenant').textContent = user.tenant_id || '-';
    document.getElementById('year').textContent = new Date().getFullYear();

    async function loadDashboard() {
      if (!token) return;
      try {
        const res = await fetch('/api/spmb/committees/active', {
          headers: { 'Authorization': 'Bearer ' + token },
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById('activeCommittees').textContent = data.data.length || 0;
        }
      } catch (e) {
        console.error('[SPMB DASHBOARD]', e);
      }
    }

    function logout() {
      localStorage.removeItem('spmb_token');
      localStorage.removeItem('spmb_user');
      window.location.href = '/SPMB/spmb-login.html';
    }

    loadDashboard();
  </script>
</body>
</html>
