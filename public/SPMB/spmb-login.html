<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login SPMB - Penerimaan Siswa</title>
  <link rel="stylesheet" href="/SPMB/css/tailwind.css">
  <link rel="stylesheet" href="/SPMB/css/spmb-theme.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="spmb-page min-h-screen flex">
  <div class="login-bg text-white w-full lg:w-1/2 flex items-center justify-center p-8 hidden lg:flex">
    <div class="max-w-md">
      <p class="text-sm font-medium text-indigo-200 mb-3">Penerimaan Siswa Baru</p>
      <h1 class="text-3xl sm:text-4xl font-bold mb-4 leading-tight">Login Panitia SPMB</h1>
      <p class="text-indigo-100 leading-relaxed">Gunakan akun yang telah terdaftar untuk mengelola kegiatan penerimaan siswa baru.</p>
    </div>
  </div>
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <div class="spmb-card spmb-p-8">
        <div class="spmb-flex spmb-items-center spmb-gap-2 spmb-mb-6">
          <div class="spmb-logo-icon" style="width: 2.5rem; height: 2.5rem;"><i class="fa-solid fa-graduation-cap"></i></div>
          <h2 class="text-2xl font-semibold text-slate-900">Selamat datang</h2>
        </div>
        <p class="spmb-text-muted spmb-mb-6">Masuk untuk mengelola data SPMB.</p>
        
        <form id="spmbLoginForm" class="spmb-flex spmb-flex-col spmb-gap-4">
          <div>
            <label for="email" class="spmb-label">Email</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fa-solid fa-user text-slate-400"></i>
              </div>
              <input type="email" id="email" name="email" required autocomplete="email"
                class="spmb-input spmb-pl-10" placeholder="nama@conto.com">
            </div>
          </div>
          <div>
            <label for="password" class="spmb-label">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i class="fa-solid fa-lock text-slate-400"></i>
              </div>
              <input type="password" id="password" name="password" required autocomplete="current-password"
                class="spmb-input spmb-pl-10 spmb-pr-12" placeholder="Masukkan password">
              <button type="button" id="togglePassword"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
                <i class="fa-solid fa-eye-slash hidden" id="eyeSlashIcon"></i>
              </button>
            </div>
          </div>
          <button type="submit" id="loginBtn" class="spmb-btn spmb-btn-primary spmb-btn-lg spmb-mt-2">
            <i class="fa-solid fa-sign-in-alt"></i> Masuk
          </button>
          <div id="loadingSpinner" class="hidden spmb-text-center spmb-py-4">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent spmb-mb-2"></div>
            <p class="spmb-text-sm spmb-text-muted">Sedang masuk...</p>
          </div>
        </form>
        
        <div class="spmb-text-center spmb-mt-4">
          <p class="spmb-text-sm spmb-text-muted">
            Belum punya akun? 
            <a href="/SPMB/spmb-register.html" class="text-indigo-600 hover:text-indigo-700 font-medium">Daftar di sini</a>
          </p>
        </div>
      </div>
      
      <div class="spmb-text-center spmb-mt-4 spmb-text-sm spmb-text-muted">
        <a href="/SPMB/spmb-public.html" class="hover:text-indigo-600">← Kembali ke Portal</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('spmbLoginForm');
      const loginBtn = document.getElementById('loginBtn');
      const loadingSpinner = document.getElementById('loadingSpinner');

      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      const eyeSlashIcon = document.getElementById('eyeSlashIcon');

      if (togglePassword && passwordInput && eyeIcon && eyeSlashIcon) {
        togglePassword.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          eyeIcon.classList.toggle('hidden');
          eyeSlashIcon.classList.toggle('hidden');
        });
      }

      const token = localStorage.getItem('spmb_token');
      if (token) {
        window.location.href = '/SPMB/spmb-dashboard.html';
        return;
      }

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          try {
            e.preventDefault();
            e.stopPropagation();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let hasError = false;

            if (!email) { document.getElementById('email').classList.add('spmb-input-error'); hasError = true; }
            if (!password) { document.getElementById('password').classList.add('spmb-input-error'); hasError = true; }
            if (hasError) return;

            loginBtn.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');

            const response = await fetch('/api/spmb/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password }),
            });

            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            const data = await response.json();

            if (data.success) {
              localStorage.setItem('spmb_token', data.token);
              localStorage.setItem('spmb_user', JSON.stringify(data.user));
              Swal.fire({ title: 'Login Berhasil!', text: data.message || 'Selamat datang di SPMB', icon: 'success', timer: 1500, showConfirmButton: false }).then(() => {
                window.location.href = '/SPMB/spmb-dashboard.html';
              });
            } else {
              Swal.fire({ title: 'Login Gagal', text: data.message || 'Email atau password salah', icon: 'error', confirmButtonText: 'Coba Lagi' });
            }
          } catch (error) {
            console.error('SPMB Login error:', error);
            Swal.fire({ title: 'Kesalahan Jaringan', text: 'Tidak dapat terhubung ke server. Periksa koneksi Anda.', icon: 'error', confirmButtonText: 'OK' });
          } finally {
            loginBtn.classList.remove('hidden');
            loadingSpinner.classList.add('hidden');
          }
        });
      }
    });
  </script>

  <style>
    .login-bg {
      background: linear-gradient(135deg, #312e81 0%, #4f46e5 50%, #6366f1 100%);
    }
  </style>
</body>
</html>
