<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xendit Payment - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-xl shadow-sm border border-gray-100 p-6 text-center">
    <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
      <i class="fas fa-wallet text-purple-600 text-3xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Xendit Payment Gateway</h1>
    <p class="text-gray-600 mb-6">Membuat invoice SPP...</p>
    
    <div id="loading" class="hidden">
      <i class="fas fa-spinner fa-spin text-4xl text-purple-600 mb-4"></i>
      <p>Mohon tunggu, mengalihkan ke halaman pembayaran...</p>
    </div>
    
    <div id="error" class="hidden text-red-600">
      <i class="fas fa-exclamation-circle text-3xl mb-2"></i>
      <p id="errorMessage">Gagal membuat invoice</p>
      <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg">Coba Lagi</button>
    </div>
  </div>

  <script>
    // Default demo data
    const DEFAULT_TENANT = 'PPIB';
    const DEFAULT_STUDENT = '2311';
    
    async function createInvoice() {
      try {
        // Data dummy (tidak ambil dari database)
        const studentId = 999999;
        const amount = 100000;

        const res = await fetch('/api/xendit/public/create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_id: DEFAULT_TENANT, student_id: studentId, amount: amount })
        });
        const json = await res.json();
        
        if (json.success && json.invoice_url) {
          document.getElementById('loading').classList.remove('hidden');
          setTimeout(() => window.open(json.invoice_url, '_blank'), 500);
          setTimeout(() => window.close(), 1000);
        } else {
          throw new Error(json.message || 'Gagal');
        }
      } catch (e) {
        document.getElementById('errorMessage').textContent = e.message;
        document.getElementById('error').classList.remove('hidden');
      }
    }
    
    createInvoice();
  </script>
</body>
</html>
