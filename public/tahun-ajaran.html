<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tahun Ajaran - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-dashboard.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .nav-active { background-color: #3b82f6; color: white; }
    .modal { display: none; }
    .modal.show { display: flex; }
    .modal-content.show { display: block; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white shadow-lg border-r">
      <div class="p-6 border-b">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
            <i class="fas fa-calendar-alt text-white"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-900">YPWI Lutim Admin</h1>
            <p class="text-sm text-gray-500">Tahun Ajaran</p>
          </div>
        </div>
      </div>
      <nav class="p-4 space-y-2">
        <button onclick="location.href='admin-dashboard.html'" class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </button>
        <button class="nav-item nav-active w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100">
          <i class="fas fa-calendar-alt"></i>
          <span>Tahun Ajaran</span>
        </button>
        <button onclick="location.href='bendahara-dashboard.html'" class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
          <i class="fas fa-chart-pie text-emerald-600"></i>
          <span>Dashboard Bendahara</span>
        </button>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h2 class="text-3xl font-bold text-gray-900">Tahun Ajaran</h2>
          <p class="text-gray-600 mt-1">Kelola tahun ajaran dan semester</p>
        </div>
        <button onclick="openCreateModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
          <i class="fas fa-plus mr-2"></i>Tahun Ajaran Baru
        </button>
      </div>

      <div id="taContainer">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-4 border-b border-gray-100">
            <input type="text" id="taSearch" onkeyup="filterTA()" placeholder="Cari tahun ajaran..."
              class="w-full md:w-96 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">No</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Nama</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Periode</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Bulan Mulai</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Tanggal</th>
                  <th class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase">Status</th>
                  <th class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase">Aksi</th>
                </tr>
              </thead>
              <tbody id="taTableBody">
                <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="semesterSection" class="mt-8 hidden">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="p-6 border-b border-gray-100 flex justify-between items-center">
            <h3 class="text-xl font-semibold text-gray-900" id="semesterSectionTitle">Semester</h3>
            <button onclick="openSemesterModal()" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
              <i class="fas fa-plus mr-1"></i>Tambah Semester
            </button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">No</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Nama</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Tanggal Mulai</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase">Tanggal Selesai</th>
                  <th class="px-6 py-3 text-center text-xs font-semibold text-gray-600 uppercase">Aksi</th>
                </tr>
              </thead>
              <tbody id="semesterTableBody">
                <tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">Belum ada semester</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="taModal" class="modal fixed inset-0 z-50 bg-black bg-opacity-50 items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-semibold" id="taModalTitle">Tahun Ajaran Baru</h3>
        <button onclick="closeTaModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
      </div>
      <form id="taForm" onsubmit="saveTA(event)">
        <input type="hidden" id="taId">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Tahun Ajaran</label>
            <input type="text" id="taNama" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Contoh: TA 2025/2026">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Mulai</label>
              <input type="text" id="taTahunMulai" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="2025">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Selesai</label>
              <input type="text" id="taTahunSelesai" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="2026">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Bulan Mulai</label>
              <select id="taBulanMulai" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
                <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
                <option value="7" selected>Juli</option><option value="8">Agustus</option><option value="9">September</option>
                <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tenant ID</label>
              <input type="text" id="taTenantId" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Kosongkan untuk global">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Mulai</label>
              <input type="date" id="taTanggalMulai" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Selesai</label>
              <input type="date" id="taTanggalSelesai" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
          </div>
          <div class="flex items-center gap-3">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" id="taIsActive" checked class="sr-only peer">
              <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
              <span class="ml-3 text-sm font-medium text-gray-700">Aktif</span>
            </label>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="closeTaModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Batal</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div id="semesterModal" class="modal fixed inset-0 z-50 bg-black bg-opacity-50 items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4 p-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-semibold">Tambah Semester</h3>
        <button onclick="closeSemesterModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times text-xl"></i></button>
      </div>
      <form id="semesterForm" onsubmit="saveSemester(event)">
        <input type="hidden" id="semesterTaId">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Semester</label>
            <select id="semesterNama" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="Ganjil">Ganjil</option>
              <option value="Genap">Genap</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Mulai</label>
              <input type="date" id="semesterTanggalMulai" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Selesai</label>
              <input type="date" id="semesterTanggalSelesai" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
          </div>
        </div>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" onclick="closeSemesterModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">Batal</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/tahun-ajaran.js"></script>
</body>
</html>
