<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Guru - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    .step { display: none; }
    .step.active { display: block; }
    .step-indicator { transition: all 0.3s ease; }
    .step-indicator.active { background: #2563eb; color: white; }
    .step-indicator.completed { background: #10b981; color: white; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Pendaftaran Guru YPWI Lutim</h1>
      <p class="text-gray-600">Lengkapi data dan upload berkas untuk mendaftar sebagai guru</p>
    </div>

    <!-- Step Indicators -->
    <div class="flex justify-between mb-8">
      <div class="step-indicator active w-10 h-10 rounded-full flex items-center justify-center font-bold" data-step="1">1</div>
      <div class="step-indicator w-10 h-10 rounded-full flex items-center justify-center font-bold bg-gray-200" data-step="2">2</div>
      <div class="step-indicator w-10 h-10 rounded-full flex items-center justify-center font-bold bg-gray-200" data-step="3">3</div>
    </div>

    <form id="registrationForm">
      <!-- Step 1: Data Pribadi -->
      <div class="step active bg-white rounded-lg shadow-md p-6 mb-6" data-step="1">
        <h2 class="text-xl font-semibold mb-4">Data Pribadi</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Lengkap *</label>
            <input type="text" id="nama" name="nama" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">NIK *</label>
            <input type="text" id="nik" name="nik" required maxlength="16" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">NIP</label>
            <input type="text" id="nip" name="nip" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
            <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">No WhatsApp *</label>
            <input type="tel" id="no_wa" name="no_wa" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tempat Lahir *</label>
            <input type="text" id="tempat_lahir" name="tempat_lahir" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir *</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Kelamin *</label>
            <select id="jenis_kelamin" name="jenis_kelamin" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">Pilih</option>
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status Perkawinan *</label>
            <select id="status_perkawinan" name="status_perkawinan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">Pilih</option>
              <option value="Belum Kawin">Belum Kawin</option>
              <option value="Kawin">Kawin</option>
              <option value="Cerai Hidup">Cerai Hidup</option>
              <option value="Cerai Mati">Cerai Mati</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Alamat Lengkap *</label>
            <textarea id="alamat" name="alamat" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
          </div>
        </div>
        <div class="flex justify-end mt-6">
          <button type="button" onclick="nextStep(2)" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Selanjutnya</button>
        </div>
      </div>

      <!-- Step 2: Data Pendidikan & Assignment -->
      <div class="step bg-white rounded-lg shadow-md p-6 mb-6" data-step="2">
        <h2 class="text-xl font-semibold mb-4">Data Pendidikan & Penempatan</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pendidikan Terakhir *</label>
            <select id="pendidikan_terakhir" name="pendidikan_terakhir" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">Pilih</option>
              <option value="SMA">SMA/SMK</option>
              <option value="D3">D3</option>
              <option value="D4">D4</option>
              <option value="S1">S1</option>
              <option value="S2">S2</option>
              <option value="S3">S3</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jurusan *</label>
            <input type="text" id="jurusan" name="jurusan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Sekolah Pendidikan *</label>
            <input type="text" id="nama_sekolah_pendidikan" name="nama_sekolah_pendidikan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Angkatan *</label>
            <input type="text" id="tahun_angkatan" name="tahun_angkatan" required placeholder="2024" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Sekolah Penempatan *</label>
            <select id="tenant_id" name="tenant_id" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">Pilih Sekolah</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Jabatan di Unit *</label>
            <select id="jabatan_di_unit" name="jabatan_di_unit" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">Pilih</option>
              <option value="Guru">Guru</option>
              <option value="Wali Kelas">Wali Kelas</option>
              <option value="Kepala Sekolah">Kepala Sekolah</option>
              <option value="Pimpinan">Pimpinan</option>
              <option value="TU">TU</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Bank</label>
            <select id="bank" name="bank" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
              <option value="">Pilih</option>
              <option value="BCA">BCA</option>
              <option value="BNI">BNI</option>
              <option value="BRI">BRI</option>
              <option value="Mandiri">Mandiri</option>
              <option value="BSI">BSI</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Rekening</label>
            <input type="text" id="nomor_rekening" name="nomor_rekening" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div class="flex justify-between mt-6">
          <button type="button" onclick="prevStep(1)" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Kembali</button>
          <button type="button" onclick="nextStep(3)" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Selanjutnya</button>
        </div>
      </div>

      <!-- Step 3: Upload Berkas -->
      <div class="step bg-white rounded-lg shadow-md p-6 mb-6" data-step="3">
        <h2 class="text-xl font-semibold mb-4">Upload Berkas</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Pas Foto *</label>
            <input type="file" id="foto" name="foto" accept="image/*" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">KTP *</label>
            <input type="file" id="ktp" name="ktp" accept="image/*,.pdf" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">KK *</label>
            <input type="file" id="kk" name="kk" accept="image/*,.pdf" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ijazah Terakhir *</label>
            <input type="file" id="ijazah" name="ijazah" accept="image/*,.pdf" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
          </div>
        </div>
        <div class="flex justify-between mt-6">
          <button type="button" onclick="prevStep(2)" class="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">Kembali</button>
          <button type="submit" class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">Kirim Pendaftaran</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Password Setup Modal -->
  <div id="passwordModal" style="display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 1001; align-items: center; justify-content: center; padding: 1rem;">
    <div style="max-width: 400px; width: 100%; background: #fff; border-radius: 1rem; padding: 1.5rem; box-sizing: border-box; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i class="fas fa-lock" style="font-size: 1.25rem; color: #2563eb;"></i>
          <h3 style="margin: 0; font-size: 1.1rem; font-weight: 700; color: #0f172a;">Atur Password</h3>
        </div>
      </div>
      <p style="margin: 0 0 1rem 0; font-size: 0.85rem; color: #64748b;">Buat password untuk akun Anda. Password ini akan digunakan untuk login.</p>
      <form id="passwordForm" onsubmit="submitPassword(event)">
        <input type="hidden" id="pendingTeacherId">
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 0.25rem;">Password Baru</label>
          <input type="password" id="newPassword" required minlength="6" style="width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.95rem;" placeholder="Minimal 6 karakter">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 0.25rem;">Konfirmasi Password</label>
          <input type="password" id="confirmPassword" required minlength="6" style="width: 100%; padding: 0.65rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; font-size: 0.95rem;" placeholder="Ulangi password">
        </div>
        <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
          <button type="button" onclick="closePasswordModal()" style="padding: 0.65rem 1.25rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; background: #fff; color: #475569; font-weight: 600; cursor: pointer;">Batal</button>
          <button type="submit" id="passwordSubmitBtn" style="padding: 0.65rem 1.25rem; border-radius: 0.5rem; border: none; background: #2563eb; color: white; font-weight: 700; cursor: pointer;">Simpan Password</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentStep = 1;
    const totalSteps = 3;
    const STORAGE_KEY = 'pendaftaran_guru_draft';

    function saveDraft() {
      const form = document.getElementById('registrationForm');
      if (!form) return;
      const data = {
        step: currentStep,
        fields: {},
        fileNames: {},
        savedAt: new Date().toISOString()
      };
      const inputs = form.querySelectorAll('input, select, textarea');
      inputs.forEach(input => {
        if (input.type === 'file') {
          if (input.files && input.files[0]) {
            data.fileNames[input.id] = input.files[0].name;
          }
        } else if (input.id && !input.readOnly) {
          data.fields[input.id] = input.value;
        }
      });
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        showDraftNotification('Draft disimpan otomatis');
      } catch (e) {
        console.error('Failed to save draft:', e);
      }
    }

    function loadDraft() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        const data = JSON.parse(saved);
        if (!data || !data.fields) return;

        Object.keys(data.fields).forEach(id => {
          const el = document.getElementById(id);
          if (el && data.fields[id]) {
            el.value = data.fields[id];
          }
        });

        if (data.fileNames) {
          Object.keys(data.fileNames).forEach(id => {
            const el = document.getElementById(id);
            if (el && el.parentElement) {
              const note = document.createElement('p');
              note.className = 'text-xs text-gray-500 mt-1';
              note.textContent = 'File sebelumnya: ' + data.fileNames[id] + ' (perlu diupload ulang)';
              note.id = id + '_draft_note';
              if (!el.parentElement.querySelector('#' + id + '_draft_note')) {
                el.parentElement.appendChild(note);
              }
            }
          });
        }

        if (data.step && data.step > 1) {
          showStep(data.step);
          showDraftNotification('Draft sebelumnya dipulihkan. Periksa kembali data Anda.', 5000);
        }
      } catch (e) {
        console.error('Failed to load draft:', e);
      }
    }

    function clearDraft() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        console.error('Failed to clear draft:', e);
      }
    }

    function showDraftNotification(message, duration = 3000) {
      const existing = document.getElementById('draftNotification');
      if (existing) existing.remove();

      const notification = document.createElement('div');
      notification.id = 'draftNotification';
      notification.style.cssText = 'position: fixed; bottom: 20px; right: 20px; background: #10b981; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 300px;';
      notification.innerHTML = '<i class="fas fa-save" style="margin-right: 8px;"></i>' + message;
      document.body.appendChild(notification);

      setTimeout(() => {
        if (notification.parentElement) {
          notification.remove();
        }
      }, duration);
    }

    function showStep(step) {
      document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
      document.querySelector(`.step[data-step="${step}"]`).classList.add('active');

      document.querySelectorAll('.step-indicator').forEach(ind => {
        ind.classList.remove('active', 'completed');
        if (parseInt(ind.dataset.step) < step) ind.classList.add('completed');
        if (parseInt(ind.dataset.step) === step) ind.classList.add('active');
      });

      currentStep = step;
      saveDraft();
    }

    function nextStep(step) {
      if (validateStep(currentStep)) {
        showStep(step);
      }
    }

    function prevStep(step) {
      showStep(step);
    }

    function validateStep(step) {
      const stepEl = document.querySelector(`.step[data-step="${step}"]`);
      const required = stepEl.querySelectorAll('[required]');
      let valid = true;
      required.forEach(field => {
        if (!field.value.trim()) {
          valid = false;
          field.classList.add('border-red-500');
        } else {
          field.classList.remove('border-red-500');
        }
      });
      if (!valid) {
        Swal.fire('Error', 'Mohon lengkapi semua field yang wajib diisi', 'error');
      }
      return valid;
    }

    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateStep(3)) return;

      const formData = new FormData();
      formData.append('nama', document.getElementById('nama').value);
      formData.append('nik', document.getElementById('nik').value);
      formData.append('nip', document.getElementById('nip').value);
      formData.append('email', document.getElementById('email').value);
      formData.append('no_wa', document.getElementById('no_wa').value);
      formData.append('tempat_lahir', document.getElementById('tempat_lahir').value);
      formData.append('tanggal_lahir', document.getElementById('tanggal_lahir').value);
      formData.append('jenis_kelamin', document.getElementById('jenis_kelamin').value);
      formData.append('status_perkawinan', document.getElementById('status_perkawinan').value);
      formData.append('alamat', document.getElementById('alamat').value);
      formData.append('pendidikan_terakhir', document.getElementById('pendidikan_terakhir').value);
      formData.append('jurusan', document.getElementById('jurusan').value);
      formData.append('nama_sekolah_pendidikan', document.getElementById('nama_sekolah_pendidikan').value);
      formData.append('tahun_angkatan', document.getElementById('tahun_angkatan').value);
      formData.append('tenant_id', document.getElementById('tenant_id').value);
      formData.append('jabatan_di_unit', document.getElementById('jabatan_di_unit').value);
      formData.append('bank', document.getElementById('bank').value);
      formData.append('nomor_rekening', document.getElementById('nomor_rekening').value);
      formData.append('foto', document.getElementById('foto').files[0]);
      formData.append('ktp', document.getElementById('ktp').files[0]);
      formData.append('kk', document.getElementById('kk').files[0]);
      formData.append('ijazah', document.getElementById('ijazah').files[0]);

      try {
        const response = await fetch('/api/public/register-guru', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.success) {
          clearDraft();
          document.getElementById('pendingTeacherId').value = result.teacher_id;
          document.getElementById('passwordModal').style.display = 'flex';
          document.getElementById('newPassword').focus();
        } else {
          Swal.fire('Gagal', result.message || 'Gagal mendaftar', 'error');
        }
      } catch (error) {
        Swal.fire('Error', 'Terjadi kesalahan jaringan. Data Anda telah disimpan sebagai draft dan bisa dilanjutkan nanti.', 'error');
        saveDraft();
      }
    });

    async function submitPassword(e) {
      e.preventDefault();
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const teacherId = document.getElementById('pendingTeacherId').value;

      if (!password || password.length < 6) {
        Swal.fire('Error', 'Password minimal 6 karakter', 'error');
        return;
      }
      if (password !== confirm) {
        Swal.fire('Error', 'Konfirmasi password tidak cocok', 'error');
        return;
      }

      const submitBtn = document.getElementById('passwordSubmitBtn');
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

      try {
        const response = await fetch(`/api/public/set-password/${teacherId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const result = await response.json();
        if (result.success) {
          Swal.fire({
            title: 'Pendaftaran Berhasil',
            text: 'Password berhasil disimpan. Silakan tunggu persetujuan admin.',
            icon: 'success',
            confirmButtonColor: '#066e3a'
          }).then(() => {
            window.location.href = 'menunggu-persetujuan.html';
          });
        } else {
          Swal.fire('Gagal', result.message || 'Gagal menyimpan password', 'error');
        }
      } catch (error) {
        Swal.fire('Error', 'Terjadi kesalahan jaringan', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    }

    function closePasswordModal() {
      document.getElementById('passwordModal').style.display = 'none';
    }

    window.addEventListener('beforeunload', () => {
      saveDraft();
    });

    document.getElementById('registrationForm').addEventListener('input', () => {
      saveDraft();
    });

    document.getElementById('registrationForm').addEventListener('change', () => {
      saveDraft();
    });

    window.addEventListener('load', () => {
      loadDraft();
    });

    // Load tenants
    fetch('/api/public/tenants')
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          const select = document.getElementById('tenant_id');
          data.data.forEach(t => {
            const option = document.createElement('option');
            option.value = t.tenant_id;
            option.textContent = t.nama_sekolah || t.tenant_id;
            select.appendChild(option);
          });
        }
      });
  </script>
</body>
</html>
