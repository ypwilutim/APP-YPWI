<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <button onclick="window.location.href='login.html'" class="w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
