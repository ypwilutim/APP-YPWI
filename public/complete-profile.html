<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lengkapi Profil - YPWI Lutim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :required {
      border-color: #fca5a5 !important;
      background-color: #fff5f5 !important;
    }
    :required:focus {
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1) !important;
    }
    @media (max-width: 640px) {
      .pasangan-row {
        grid-template-columns: 1fr !important;
      }
      .pasangan-row .cari-nik-btn,
      .pasangan-row .hapus-pasangan-btn {

</head>

<body class="min-h-screen py-8 profile-page">
  <div class="pt-28 pb-12">
    <div class="max-w-7xl mx-auto px-6">
      <div class="glass rounded-3xl shadow-2xl p-10 border border-gray-100">
        <div class="text-center mb-10">
          <img src="assets/images/YPWI LOGO HITAM.png" alt="YPWI Logo"
            class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-white object-contain shadow-lg p-2">
          <h1 class="text-4xl font-extrabold text-gray-950">Lengkapi Profil Guru</h1>
          <p class="text-gray-600 mt-2 text-lg">Lengkapi data pribadi Anda untuk akses sistem dan administrasi.</p>
        </div>

        <form id="profileForm">
          <input type="hidden" id="teacherId" name="teacherId">
          <input type="hidden" id="link_foto" name="link_foto">
          <input type="hidden" id="assignments_json" name="assignments" required>

          <div class="grid md:grid-cols-2 gap-10">
            <div class="space-y-6">
              <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2 border-b pb-3">
                <i class="bi bi-person-badge text-primary"></i> Data Identitas Pribadi
              </h3>

              <div>
                <label for="nama" class="block text-sm font-semibold text-gray-700 mb-2">Nama Lengkap <span
                    class="text-red-500">*</span></label>
                <input type="text" id="nama" name="nama" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="nip" class="block text-sm font-semibold text-gray-700 mb-2">NIY</label>
                  <input type="text" id="nip" name="nip"
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium"
                    placeholder="NIY">
                </div>
                <div>
                  <label for="nik" class="block text-sm font-semibold text-gray-700 mb-2">NIK <span
                      class="text-red-500">*</span></label>
                  <input type="text" id="nik" name="nik" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium"
                    placeholder="NIK">
                </div>
              </div>

              <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email Aktif <span
                    class="text-red-500">*</span></label>
                <input type="email" id="email" name="email" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="tempat_lahir" class="block text-sm font-semibold text-gray-700 mb-2">Tempat Lahir <span
                      class="text-red-500">*</span></label>
                  <input type="text" id="tempat_lahir" name="tempat_lahir" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
                <div>
                  <label for="tanggal_lahir" class="block text-sm font-semibold text-gray-700 mb-2">Tanggal Lahir <span
                      class="text-red-500">*</span></label>
                  <input type="date" id="tanggal_lahir" name="tanggal_lahir" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="jenis_kelamin" class="block text-sm font-semibold text-gray-700 mb-2">Jenis Kelamin <span
                      class="text-red-500">*</span></label>
                  <select id="jenis_kelamin" name="jenis_kelamin" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="">Pilih</option>
                    <option value="L">Laki-laki</option>
                    <option value="P">Perempuan</option>
                  </select>
                </div>
                <div>
                  <label for="no_wa" class="block text-sm font-semibold text-gray-700 mb-2">No. WhatsApp <span
                      class="text-red-500">*</span></label>
                  <input type="tel" id="no_wa" name="no_wa" placeholder="08xxxxxxxx" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="status_perkawinan" class="block text-sm font-semibold text-gray-700 mb-2">Status Perkawinan <span
                      class="text-red-500">*</span></label>
                  <select id="status_perkawinan" name="status_perkawinan" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="">Pilih</option>
                    <option value="Lajang">Lajang</option>
                    <option value="Menikah">Menikah</option>
                    <option value="Cerai Hidup">Cerai Hidup</option>
                    <option value="Cerai Mati">Cerai Mati</option>
                  </select>
                </div>
                <div id="jumlah_anak_field" class="hidden">
                  <label for="jumlah_anak" class="block text-sm font-semibold text-gray-700 mb-2">Jumlah Anak yang Hidup</label>
                  <input type="number" id="jumlah_anak" name="jumlah_anak" min="0" value="0"
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>

              <div id="pasangan_fields" class="hidden space-y-4">
                <div>
                  <label class="block text-sm font-semibold text-gray-700 mb-2">Data Pasangan / Mantan</label>
                  <div id="pasangan_list" class="space-y-3"></div>
                  <button type="button" id="add_pasangan_btn"
                    class="mt-2 px-4 py-2 bg-blue-50 text-blue-700 border border-blue-200 rounded-lg text-sm font-semibold hover:bg-blue-100 transition">
                    <i class="bi bi-plus-circle mr-1"></i> Tambah
                  </button>
                </div>
              </div>

              <div>
                <label for="alamat" class="block text-sm font-semibold text-gray-700 mb-2">Alamat Lengkap <span
                    class="text-red-500">*</span></label>
                <textarea id="alamat" name="alamat" rows="3" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium resize-none"
                  placeholder="Masukkan alamat lengkap..."></textarea>
              </div>
            </div>

            <div class="space-y-6">
              <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2 border-b pb-3">
                <i class="bi bi-briefcase text-primary"></i> Data Kepegawaian
              </h3>

              <div>
                <label for="status_kepegawaian" class="block text-sm font-semibold text-gray-700 mb-2">Status Pegawai
                  <span class="text-red-500">*</span></label>
                <select id="status_kepegawaian" name="status_kepegawaian" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                  <option value="">Pilih Status</option>
                  <option value="PTY">PTY</option>
                  <option value="PKY">PKY</option>
                  <option value="Honor">Honor</option>
                </select>
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="status_aktif" class="block text-sm font-semibold text-gray-700 mb-2">Status Aktif <span
                      class="text-red-500">*</span></label>
                  <select id="status_aktif" name="status_aktif" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="1">Aktif</option>
                    <option value="0">Tidak Aktif</option>
                  </select>
                </div>
                <div>
                  <label for="tmt" class="block text-sm font-semibold text-gray-700 mb-2">TMT (Tanggal Masuk) <span
                      class="text-red-500">*</span></label>
                  <input type="date" id="tmt" name="tmt" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                </div>
              </div>

              <div>
                <label for="pendidikan_terakhir" class="block text-sm font-semibold text-gray-700 mb-2">Pendidikan
                  Terakhir <span class="text-red-500">*</span></label>
                <select id="pendidikan_terakhir" name="pendidikan_terakhir" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                  <option value="">Pilih Pendidikan</option>
                  <option value="SD">SD</option>
                  <option value="SMP">SMP</option>
                  <option value="SMA">SMA</option>
                  <option value="SMK">SMK</option>
                  <option value="D1">D1</option>
                  <option value="D2">D2</option>
                  <option value="D3">D3</option>
                  <option value="S1">S1</option>
                  <option value="S2">S2</option>
                  <option value="S3">S3</option>
                  <option value="Lainnya">Lainnya</option>
                </select>
              </div>

              <div id="jurusan-field" class="hidden">
                <label for="jurusan" class="block text-sm font-semibold text-gray-700 mb-2">Nama Sekolah/Universitas
                  <span class="text-red-500">*</span></label>
                <input type="text" id="jurusan" name="jurusan" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium"
                  placeholder="SMAN 1 Tomoni / IAIN / Universitas ...">
              </div>

              <div id="nama_sekolah-field" class="hidden">
                <label for="nama_sekolah_pendidikan" class="block text-sm font-semibold text-gray-700 mb-2">Jurusan
                  <span class="text-red-500">*</span></label>
                <input type="text" id="nama_sekolah_pendidikan" name="nama_sekolah_pendidikan" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium"
                  placeholder="IPA / Teknis Komputer / Pend. Agama Islam">
              </div>

              <div id="tahun-field" class="hidden">
                <label for="tahun_angkatan" class="block text-sm font-semibold text-gray-700 mb-2">Tahun Lulus <span
                    class="text-red-500">*</span></label>
                <input type="text" id="tahun_angkatan" name="tahun_angkatan" required
                  class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium"
                  placeholder="2019">
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label for="bank" class="block text-sm font-semibold text-gray-700 mb-2">Bank <span
                      class="text-red-500">*</span></label>
                  <select id="bank" name="bank" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium">
                    <option value="">Pilih Bank</option>
                    <option value="BSI">BSI</option>
                    <option value="BNI">BNI</option>
                    <option value="BRI">BRI</option>
                    <option value="Mandiri">Mandiri</option>
                    <option value="BCA">BCA</option>
                    <option value="CIMB Niaga">CIMB Niaga</option>
                    <option value="Permata">Permata</option>
                    <option value="BTN">BTN</option>
                    <option value="Danamon">Danamon</option>
                    <option value="Panin">Panin</option>
                    <option value="Maybank">Maybank</option>
                    <option value="OCBC NISP">OCBC NISP</option>
                    <option value="Sulselbar">Sulselbar</option>
                    <option value="Lainnya">Lainnya</option>
                  </select>
                </div>
                <div>
                  <label for="nomor_rekening" class="block text-sm font-semibold text-gray-700 mb-2">Nomor Rekening
                    <span class="text-red-500">*</span></label>
                  <input type="text" id="nomor_rekening" name="nomor_rekening" required
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium"
                    placeholder="Nomor Rekening">
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Penempatan di Unit Sekolah <span
                    class="text-red-500">*</span></label>
                <button type="button" id="addAssignmentBtn"
                  class="w-full py-3 px-4 bg-primary/10 text-primary border-2 border-dashed border-primary/30 rounded-xl font-bold hover:bg-primary/20 transition flex items-center justify-center gap-2">
                  <i class="bi bi-plus-circle"></i> Tambah Penempatan Unit
                </button>
                <div id="assignments-container"
                  class="mt-4 overflow-hidden border border-gray-200 rounded-xl shadow-inner">
                  <table class="w-full text-sm">
                    <thead class="bg-gray-100 text-gray-700 border-b">
                      <tr>
                        <th class="px-4 py-3 text-left">Unit Sekolah</th>
                        <th class="px-4 py-3 text-left">Jabatan</th>
                        <th class="px-4 py-3 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody id="assignments-table-body" class="bg-white divide-y divide-gray-100"></tbody>
                  </table>
                </div>
              </div>

              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Pas Foto <span
                    class="text-red-500">*</span></label>
                <div class="flex items-center gap-4 bg-gray-50 border border-gray-200 p-4 rounded-2xl">
                  <div
                    class="border-2 border-dashed border-gray-300 rounded-xl p-3 text-center flex-1 hover:border-primary transition cursor-pointer"
                    id="photoUploadArea">
                    <input type="file" class="hidden" id="foto" name="foto" accept="image/*">
                    <i class="bi bi-camera-fill text-primary text-3xl mb-2"></i>
                    <p class="text-gray-700 font-medium text-sm mb-1">Klik untuk upload foto</p>
                  </div>
                  <div
                    class="w-20 h-20 rounded-2xl border-2 border-gray-200 overflow-hidden bg-white flex-shrink-0 flex items-center justify-center relative">
                    <img id="photo-preview" class="w-full h-full object-cover hidden">
                    <i class="bi bi-person text-gray-400 text-3xl absolute" id="photo-icon"></i>
                  </div>
                </div>
                <div id="existing-photo-info" class="mt-2 hidden">
                  <small class="text-green-600">
                    <i class="bi bi-check-circle-fill mr-1"></i>
                    Foto sudah tersimpan di database
                  </small>
                </div>
              </div>
            </div>
          </div>

          <div class="pt-10 border-t border-gray-100">
            <button type="submit"
              class="w-full max-w-lg mx-auto bg-[#066e3a] text-white font-extrabold py-4 px-8 rounded-3xl text-xl flex items-center justify-center gap-3 shadow-lg transform hover:scale-[1.02] transition">
              <i class="bi bi-cloud-arrow-up-fill"></i>
              SIMPAN DATA PROFIL
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="modal-penempatan"
    class="hidden fixed inset-0 z-[999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl scale-95 transition-all duration-300">
      <h3 class="text-xl font-bold text-gray-950 mb-6 flex items-center gap-2">
        <i class="bi bi-building-add text-primary"></i> Tambah Penempatan Unit
      </h3>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Unit Sekolah</label>
          <select id="assignmentUnit" required
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary outline-none font-medium">
            <option value="">Pilih Unit Sekolah</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Jabatan</label>
<select id="assignmentJabatan" required
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 focus:border-primary outline-none font-medium">
            <option value="">Pilih Jabatan</option>
            <option value="Ketua">Ketua</option>
            <option value="Pimpinan Pondok">Pimpinan Pondok</option>
            <option value="Kepala Sekolah">Kepala Sekolah</option>
            <option value="Wakasek">Wakasek</option>
            <option value="Admin">Admin</option>
            <option value="Operator">Operator</option>
            <option value="Bendahara">Bendahara</option>
            <option value="Media">Media</option>
            <option value="Guru Mapel">Guru Mapel</option>
            <option value="Walikelas">Walikelas</option>
            <option value="TU">TU</option>
            <option value="Security">Security</option>
            <option value="Cleaning Service">Cleaning Service</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 mt-8">
        <button type="button" id="closeAssignmentBtn"
          class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-bold hover:bg-gray-200 transition">Batal</button>
        <button type="button" id="saveAssignmentBtn"
          class="px-5 py-2.5 bg-[#066e3a] text-white rounded-xl font-bold hover:bg-[#066e3a]/90 transition flex items-center gap-1.5">
          <i class="bi bi-check-circle"></i> Tambahkan
        </button>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const teacherId = new URLSearchParams(window.location.search).get('teacher_id') || sessionStorage.getItem('teacherId');

    if (!teacherId) {
      Swal.fire({ title: 'Akses Tidak Sah', text: 'ID Guru tidak ditemukan.', icon: 'error' }).then(() => {
        window.location.href = 'login.html';
      });
      throw new Error('No teacher ID');
    }
    document.getElementById('teacherId').value = teacherId;

    fetchTeacherData();
    fetchTenants();

async function fetchTeacherData() {
       try {
         const response = await fetch('/api/public/teachers/' + teacherId);
         const res = await response.json();
         console.log('Teacher data response:', res);
          if (res.success && res.data) {
             populateForm(res.data);
             localAssignments = res.data.assignments || [];
             displayAssignments(localAssignments);
           } else {
             console.error('API error:', res.message);
           }
       } catch (error) {
         console.error('Error fetching teacher data:', error);
       }
     }

    async function fetchTenants() {
      try {
        const response = await fetch('/api/tenants');
        if (response.ok) {
          const res = await response.json();
          if (res.success) {
            populateTenantSelect(res.data);
          }
        }
      } catch (error) {
        console.error('Error fetching tenants:', error);
      }
    }

    function populateTenantSelect(tenants) {
      const select = document.getElementById('assignmentUnit');
      select.innerHTML = '<option value="">Pilih Unit Sekolah</option>';
      tenants.forEach(tenant => {
        const option = document.createElement('option');
        option.value = tenant.tenant_id;
        option.textContent = tenant.nama_sekolah + ' (' + tenant.tenant_id + ')';
        select.appendChild(option);
      });
    }

function populateForm(teacher) {
      const setValue = (id, value) => {
        const el = document.getElementById(id);
        if (el) {
          el.value = value || '';
        }
      };

      setValue('nama', teacher.nama);
      if (teacher.nik && !String(teacher.nik).startsWith('NIK-')) {
        document.getElementById('nik').value = teacher.nik;
      } else {
        document.getElementById('nik').value = '';
      }
      setValue('nip', teacher.nip);
      setValue('tempat_lahir', teacher.tempat_lahir);
      setValue('tanggal_lahir', teacher.tanggal_lahir);
      setValue('jenis_kelamin', teacher.jenis_kelamin);
      setValue('alamat', teacher.alamat);
      setValue('email', teacher.email);
      setValue('no_wa', teacher.no_wa);
      setValue('status_kepegawaian', teacher.status_kepegawaian);
      setValue('tmt', teacher.tmt);
      setValue('status_aktif', teacher.status_aktif);

      if (teacher.pendidikan_terakhir) {
        const parts = teacher.pendidikan_terakhir.split('/');
        if (parts[0]) document.getElementById('pendidikan_terakhir').value = parts[0];
        if (parts[1]) document.getElementById('jurusan').value = parts[1];
        if (parts[2]) document.getElementById('nama_sekolah_pendidikan').value = parts[2];
        if (parts[3]) document.getElementById('tahun_angkatan').value = parts[3];
        // Tampilkan field terkait (tahun lulus, jurusan, nama sekolah) sesuai jenjang
        if (parts[0]) updatePendidikanFields(parts[0]);
      }

setValue('nomor_rekening', teacher.nomor_rekening);
      const bankValue = teacher.bank ? String(teacher.bank).trim() : '';
      console.log('Bank value from API:', bankValue);
      setValue('bank', bankValue);

      // Pre-select bank from DB, create option if value not in the list
      const bankSelect = document.getElementById('bank');
      if (bankSelect && bankValue) {
        let found = Array.from(bankSelect.options).some(o => o.value === bankValue);
        console.log('Bank found in options:', found);
        if (!found) {
          const opt = document.createElement('option');
          opt.value = bankValue;
          opt.textContent = bankValue;
          bankSelect.appendChild(opt);
        }
        bankSelect.value = bankValue;
        console.log('Bank select value set to:', bankSelect.value);
      }

      setValue('status_perkawinan', teacher.status_perkawinan);
      setValue('jumlah_anak', teacher.jumlah_anak || 0);
      initPerkawinanToggle();

      if (teacher.data_keluarga && Array.isArray(teacher.data_keluarga)) {
        document.getElementById('pasangan_list').innerHTML = '';
        teacher.data_keluarga.forEach(item => addPasanganField(item.nik, item.nama, item.tipe));
      }

      if (teacher.link_foto) {
        document.getElementById('photo-preview').src = teacher.link_foto;
        document.getElementById('photo-preview').classList.remove('hidden');
        document.getElementById('photo-icon').classList.add('hidden');
        document.getElementById('existing-photo-info').classList.remove('hidden');
        document.getElementById('link_foto').value = teacher.link_foto;
      }
    }

    function initPerkawinanToggle() {
      const status = document.getElementById('status_perkawinan').value;
      const showPasangan = ['Menikah', 'Cerai Hidup'].includes(status);
      const showAnak = ['Menikah', 'Cerai Hidup', 'Cerai Mati'].includes(status);

      document.getElementById('pasangan_fields').classList.toggle('hidden', !showPasangan);
      document.getElementById('jumlah_anak_field').classList.toggle('hidden', !showAnak);

      // Mark pasangan NIK as required when visible
      document.querySelectorAll('.pasangan-nik').forEach(input => {
        input.required = showPasangan;
      });

      // Mark jumlah_anak as required when visible
      const jumlahAnakInput = document.getElementById('jumlah_anak');
      if (jumlahAnakInput) {
        jumlahAnakInput.required = showAnak;
      }
    }

    function addPasanganField(nik = '', nama = '', tipe = '') {
      const list = document.getElementById('pasangan_list');
      const jk = document.getElementById('jenis_kelamin').value;
      const status = document.getElementById('status_perkawinan').value;
      const isMenikah = status === 'Menikah';
      const label = tipe ? (tipe === 'suami' ? 'NIK Suami' : tipe === 'istri' ? 'NIK Istri' : 'NIK Mantan') : (isMenikah ? (jk === 'P' ? 'NIK Suami' : 'NIK Istri') : 'NIK Mantan');

      const div = document.createElement('div');
      div.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-[1fr_1fr_auto_auto] gap-2 items-center pasangan-row';
      div.dataset.tipe = tipe || (isMenikah ? (jk === 'P' ? 'suami' : 'istri') : 'mantan');
      div.innerHTML = `
        <input type="text" placeholder="${label}" class="pasangan-nik px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium" value="${nik}">
        <input type="text" placeholder="Nama" class="pasangan-nama px-4 py-3 rounded-xl border-2 border-gray-200 bg-white outline-none font-medium" value="${nama}" readonly>
        <button type="button" class="cari-nik-btn px-4 py-3 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700">Cari</button>
        <button type="button" class="hapus-pasangan-btn px-4 py-3 bg-red-600 text-white rounded-xl text-sm font-bold hover:bg-red-700"><i class="bi bi-trash"></i></button>
      `;
      list.appendChild(div);

      const nikInput = div.querySelector('.pasangan-nik');
      const namaInput = div.querySelector('.pasangan-nama');
      const cariBtn = div.querySelector('.cari-nik-btn');
      const hapusBtn = div.querySelector('.hapus-pasangan-btn');

      cariBtn.addEventListener('click', async () => {
        const nikVal = nikInput.value.trim();
        if (!nikVal) return alert('Masukkan NIK');
        try {
          const res = await fetch('/api/public/lookup-nik?nik=' + encodeURIComponent(nikVal));
          const data = await res.json();
          if (data.success && data.nama) {
            namaInput.value = data.nama;
          } else {
            namaInput.value = '';
            alert('NIK tidak ditemukan');
          }
        } catch (e) {
          console.error('Lookup NIK error:', e);
        }
      });

      hapusBtn.addEventListener('click', () => {
        div.remove();
      });
    }

    function updatePendidikanFields(value) {
      document.getElementById('tahun-field').classList.toggle('hidden', !['SD', 'SMP', 'SMA', 'SMK', 'S1', 'S2', 'S3'].includes(value));
      document.getElementById('jurusan-field').classList.toggle('hidden', !['SMK', 'S1', 'S2', 'S3'].includes(value));
      document.getElementById('nama_sekolah-field').classList.toggle('hidden', !['SMK', 'S1', 'S2', 'S3'].includes(value));
      // Enable/disable required on visible fields
      document.getElementById('tahun_angkatan').required = ['SD', 'SMP', 'SMA', 'SMK', 'S1', 'S2', 'S3'].includes(value);
      document.getElementById('jurusan').required = ['SMK', 'S1', 'S2', 'S3'].includes(value);
      document.getElementById('nama_sekolah_pendidikan').required = ['SMK', 'S1', 'S2', 'S3'].includes(value);
    }

    function initPendidikanToggle() {
      const pendidikanSelect = document.getElementById('pendidikan_terakhir');
      pendidikanSelect?.addEventListener('change', function () {
        updatePendidikanFields(this.value);
      });
    }

    let localAssignments = [];

    function displayAssignments(assignments) {
      if (assignments !== undefined) localAssignments = assignments;
      const tbody = document.getElementById('assignments-table-body');
      if (!tbody) return;
      tbody.innerHTML = localAssignments.length === 0 ? '<tr><td colspan="3" class="text-center py-4 text-gray-500">Belum ada penugasan</td></tr>' :
        localAssignments.map((a, i) => `<tr><td class="px-4 py-3">${a.tenant_id || '-'}</td><td class="px-4 py-3">${a.jabatan_di_unit || '-'}</td><td class="px-4 py-3 text-center"><button type="button" data-index="${i}" class="text-red-600 remove-assignment-btn"><i class="bi bi-trash"></i></button></td></tr>`).join('');
    }

    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('addAssignmentBtn')?.addEventListener('click', () => {
        document.getElementById('modal-penempatan').classList.remove('hidden');
        document.getElementById('modal-penempatan').classList.add('flex');
      });
      document.getElementById('photoUploadArea')?.addEventListener('click', () => {
        document.getElementById('foto').click();
      });
      document.getElementById('foto')?.addEventListener('change', e => previewPhoto(e.target));
      document.getElementById('closeAssignmentBtn')?.addEventListener('click', () => {
        document.getElementById('modal-penempatan').classList.add('hidden');
        document.getElementById('modal-penempatan').classList.remove('flex');
      });
      document.getElementById('saveAssignmentBtn')?.addEventListener('click', saveAssignment);
      document.addEventListener('click', e => {
        if (e.target.closest('.remove-assignment-btn')) {
          const btn = e.target.closest('.remove-assignment-btn');
          removeAssignment(parseInt(btn.getAttribute('data-index')));
        }
      });
      initPendidikanToggle();

      document.getElementById('status_perkawinan')?.addEventListener('change', initPerkawinanToggle);
      document.getElementById('add_pasangan_btn')?.addEventListener('click', () => addPasanganField());
    });

    function saveAssignment() {
      const tenantId = document.getElementById('assignmentUnit').value;
      const jabatan = document.getElementById('assignmentJabatan').value;
      if (!tenantId || !jabatan) return alert('Pilih Unit Sekolah dan Jabatan');
      if (localAssignments.some(a => a.tenant_id === tenantId && a.jabatan_di_unit === jabatan)) return alert('Penugasan ini sudah ada');
      localAssignments.push({ tenant_id: tenantId, jabatan_di_unit: jabatan });
      displayAssignments();
      document.getElementById('modal-penempatan').classList.add('hidden');
      document.getElementById('modal-penempatan').classList.remove('flex');
    }

    function removeAssignment(index) {
      if (!confirm('Hapus penugasan ini?')) return;
      localAssignments.splice(index, 1);
      displayAssignments();
    }

    function previewPhoto(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('photo-preview').src = e.target.result;
          document.getElementById('photo-preview').classList.remove('hidden');
          document.getElementById('photo-icon').classList.add('hidden');
          document.getElementById('existing-photo-info').classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (localAssignments.length === 0) {
        return Swal.fire('Error', 'Minimal satu penempatan unit sekolah harus dipilih.', 'error');
      }

      const pendidikan = document.getElementById('pendidikan_terakhir').value;
      const tahun = document.getElementById('tahun_angkatan').value;
      if (['SD', 'SMP', 'SMA', 'SMK', 'S1', 'S2', 'S3'].includes(pendidikan) && !tahun) {
        return Swal.fire('Error', 'Tahun lulus wajib diisi.', 'error');
      }

      const bank = document.getElementById('bank').value;
      const nomor_rekening = document.getElementById('nomor_rekening').value;
      if (!bank) {
        return Swal.fire('Error', 'Bank wajib dipilih.', 'error');
      }
      if (!nomor_rekening) {
        return Swal.fire('Error', 'Nomor rekening wajib diisi.', 'error');
      }

      const link_foto = document.getElementById('link_foto').value;
      const foto = document.getElementById('foto').files[0];
      if (!link_foto && !foto) {
        return Swal.fire('Error', 'Pas foto wajib diupload.', 'error');
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="inline-block animate-spin rounded-full h-5 w-5 border-4 border-white border-t-transparent mr-2"></div>Menyimpan...';

try {
         const formData = new FormData(e.target);
         formData.append('assignments_json', JSON.stringify(localAssignments));

// Collect pasangan data
          const pasanganList = [];
          const statusPerkawinan = document.getElementById('status_perkawinan').value;
          const jk = document.getElementById('jenis_kelamin').value;
          let defaultTipe = null;
          if (statusPerkawinan === 'Menikah') {
            defaultTipe = jk === 'P' ? 'suami' : 'istri';
          } else if (statusPerkawinan === 'Cerai Hidup') {
            defaultTipe = 'mantan';
          }
          document.querySelectorAll('#pasangan_list > div').forEach(div => {
            const nik = div.querySelector('.pasangan-nik')?.value.trim() || '';
            const nama = div.querySelector('.pasangan-nama')?.value.trim() || '';
            const tipe = div.dataset.tipe || defaultTipe;
            if (nik) pasanganList.push({ nik, nama, tipe });
          });
          formData.append('data_keluarga', JSON.stringify(pasanganList));

         // Auto-detect employment status based on assignments
        const assignments = localAssignments.map(a => a.jabatan_di_unit);
        const hasGuruRole = assignments.some(j => ['Guru Mapel', 'Walikelas', 'Guru'].includes(j));
        const hasPegawaiRole = assignments.some(j => ['Admin', 'TU', 'Operator', 'Pimpinan', 'Kepala Sekolah', 'Bendahara'].includes(j));
        const tmtValue = document.getElementById('tmt').value;
        const masaKerja = tmtValue ? (new Date().getFullYear() - new Date(tmtValue).getFullYear()) : 0;

        if (!formData.get('status_kepegawaian')) {
          let employmentType = null;
          if (hasGuruRole && hasPegawaiRole) {
            employmentType = 'GTY'; // Multi-role, prioritize guru
          } else if (hasGuruRole) {
            employmentType = masaKerja >= 2 ? 'GTY' : 'GTTY';
          } else if (hasPegawaiRole) {
            employmentType = masaKerja >= 2 ? 'PTY' : 'PTTY';
          }
          if (employmentType) formData.set('status_kepegawaian', employmentType);
        }

        const response = await fetch('/api/public/teachers/' + formData.get('teacherId'), {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + (token || '') },
          body: formData
        });

        if (response.ok) {
          await fetch('/api/profile-complete/' + teacherId, { method: 'PUT', headers: { 'Content-Type': 'application/json' } });
          Swal.fire({ title: 'Berhasil!', text: 'Profil berhasil diperbarui!', icon: 'success', timer: 3000, showConfirmButton: false }).then(() => {
            window.location.href = 'login.html';
          });
        } else {
          throw new Error('Update failed');
        }
      } catch (error) {
        Swal.fire({ title: 'Gagal', text: 'Terjadi kesalahan.', icon: 'error' });
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill"></i> SIMPAN DATA PROFIL';
      }
    });
  </script>
</body>
