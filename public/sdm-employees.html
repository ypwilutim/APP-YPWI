<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDM Employees - YPWI Lutim</title>
  <link rel="stylesheet" href="/css/sdm-employees.css">
  <style>
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-box { background: white; border-radius: 12px; padding: 24px; max-width: 480px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    .btn-detail { background: #2563eb; color: white; padding: 4px 12px; border-radius: 6px; font-size: 12px; border: none; cursor: pointer; }
    .btn-detail:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center mb-4">Manajemen Data Guru</h1>
    <p class="text-center text-gray-500 mb-6">Hanya SDM yang ditampilkan. Klik Detail untuk melihat assignment.</p>

    <div class="flex justify-center mb-6 gap-3">
      <select id="tenant-filter" class="border border-gray-300 rounded-lg px-4 py-2 bg-white shadow-sm">
        <option value="">Semua Sekolah</option>
      </select>
    </div>

    <div class="bg-white rounded-lg shadow-md overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead>
          <tr>
            <th class="text-left py-3 px-4 font-semibold text-gray-500">Nama</th>
            <th class="text-left py-3 px-4 font-semibold text-gray-500">NIK</th>
            <th class="text-left py-3 px-4 font-semibold text-gray-500">NIP</th>
            <th class="text-left py-3 px-4 font-semibold text-gray-500">Status</th>
            <th class="text-left py-3 px-4 font-semibold text-gray-500">No WA</th>
            <th class="text-left py-3 px-4 font-semibold text-gray-500">Aksi</th>
          </tr>
        </thead>
        <tbody id="employees-body">
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Detail -->
  <div id="detail-modal" class="modal-backdrop" style="display:none;" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
      <h2 class="text-xl font-bold mb-4">Detail Assignment SDM</h2>
      <div id="modal-content" class="text-sm text-gray-700 space-y-2"></div>
      <div class="mt-6 flex justify-end">
        <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-lg text-sm">Tutup</button>
      </div>
    </div>
  </div>

  <script src="sdm-employees.js"></script>
</body>
</html>
