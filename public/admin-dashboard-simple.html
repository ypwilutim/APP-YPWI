<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetemail2@11"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .nav-active { background-color: #3b82f6; color: white; }
    .skeleton-loader { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
    @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white shadow-lg border-r">
      <div class="p-6 border-b">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
            <i class="fas fa-chart-line text-white"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-900">YPWI Lutim Admin</h1>
            <p class="text-sm text-gray-500">Dashboard Panel</p>
          </div>
        </div>
      </div>

      <nav class="p-4 space-y-2 overflow-y-auto" style="max-height: calc(100vh - 100px);">
        <button class="nav-item nav-active w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-100" data-tab="dashboard">
          <i class="fas fa-chart-line"></i><span>Dashboard</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="teachers">
          <i class="fas fa-users"></i><span>Manajemen Guru</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="students">
          <i class="fas fa-user-graduate"></i><span>Manajemen Siswa</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="evaluations">
          <i class="fas fa-star"></i><span>Penilaian Guru Otomatis</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="attendance">
          <i class="fas fa-clipboard-list"></i><span>Log Kehadiran</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="whatsapp">
          <i class="fab fa-whatsapp"></i><span>Pesan WhatsApp</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="payroll">
          <i class="fas fa-wallet"></i><span>Penggajian</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="documents">
          <i class="fas fa-file-alt"></i><span>Dokumen HR</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="qr-generator">
          <i class="fas fa-qrcode"></i><span>QR Scanner & Generator</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="idcard">
          <i class="fas fa-id-card"></i><span>Cetak ID Card</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="backup">
          <i class="fas fa-database"></i><span>Backup/Restore Database</span>
        </button>
        <button class="nav-item w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100" data-tab="settings">
          <i class="fas fa-cog"></i><span>Pengaturan</span>
        </button>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <div class="flex justify-between items-center mb-8">
        <div>
          <h2 id="pageTitle" class="text-3xl font-bold text-gray-900">Dashboard</h2>
          <p class="text-gray-600 mt-1">Selamat datang kembali, <span id="adminName">Admin</span></p>
        </div>
        <span class="text-sm text-gray-500" id="currentDate"></span>
      </div>

      <div id="dashboardTab" class="tab-content">
        <p>Dashboard content - redirect ke halaman ID Card di: <a href="teacher-idcard.html">teacher-idcard.html</a> | <a href="student-idcard.html">student-idcard.html</a></p>
      </div>
    </main>
  </div>

  <script>
    function showTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(i => {
        i.classList.remove('nav-active');
        i.classList.add('text-gray-600');
      });
      document.getElementById(tabName + 'Tab')?.classList.remove('hidden');
      document.querySelector('[data-tab="' + tabName + '"]')?.classList.add('nav-active');
      document.getElementById('pageTitle').textContent = tabName;
    }
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => showTab(btn.dataset.tab));
    });
    document.getElementById('pageTitle').textContent = 'Dashboard';
  </script>
</body>
</html>
