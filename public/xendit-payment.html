<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran SPP - YPWI Lutim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-graduation-cap text-emerald-600 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Pembayaran SPP</h1>
        <p class="text-gray-600 mt-1">Yayasan Pendidikan Wahdah Islamiyah Luwu Timur</p>
      </div>

      <div id="invoiceStatus" class="space-y-4">
        <div class="text-center py-8">
          <i class="fas fa-spinner fa-spin text-3xl text-gray-400 mb-4"></i>
          <p class="text-gray-600">Memuat detail invoice...</p>
        </div>
      </div>
    </div>

    <div class="text-center mt-8">
      <p class="text-sm text-gray-500">Butuh bantuan? Hubungi bendahara sekolah Anda</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const externalId = params.get('external_id');
    let pollTimer = null;

    function normalizeStatus(s) {
      return (s || '').toString().toUpperCase();
    }

    function fmt(n) {
      return 'Rp ' + (parseFloat(n || 0).toLocaleString('id-ID'));
    }

    if (!externalId) {
      document.getElementById('invoiceStatus').innerHTML = `
        <div class="text-center py-8">
          <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-4"></i>
          <p class="text-gray-600 mb-4">Invoice tidak ditemukan. Pastikan link pembayaran benar.</p>
          <button id="testPayBtn" class="px-6 py-3 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium">
            <i class="fas fa-bolt mr-2"></i> Bayar SPP Siswa (Mode Test)
          </button>
        </div>`;
      document.getElementById('testPayBtn')?.addEventListener('click', createTestInvoice);
    } else {
      loadInvoice();
    }

    async function loadInvoice() {
      try {
        const res = await fetch('/api/xendit/public/invoice-status?external_id=' + encodeURIComponent(externalId));
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'Gagal memuat invoice');
        renderInvoice(data.data);
      } catch (err) {
        document.getElementById('invoiceStatus').innerHTML = `
          <div class="text-center py-8">
            <i class="fas fa-exclamation-circle text-4xl text-red-500 mb-4"></i>
            <p class="text-gray-600">${err.message}</p>
          </div>`;
      }
    }

    function renderInvoice(inv) {
      const status = normalizeStatus(inv.status);
      const isPaid = status === 'PAID';
      const isExpired = status === 'EXPIRED';

      const statusBadge = isPaid
        ? '<span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium">LUNAS</span>'
        : isExpired
          ? '<span class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-medium">KEDALUWARSA</span>'
          : '<span class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm font-medium">MENUNGGU PEMBAYARAN</span>';

      let bodyHtml = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="text-lg font-semibold text-gray-900">Detail Tagihan</h3>
            ${statusBadge}
          </div>
          <div class="bg-gray-50 rounded-lg p-4 space-y-2">
            <div class="flex justify-between"><span class="text-gray-600">Deskripsi</span><span class="text-gray-900 font-medium text-right">${inv.description || '-'}</span></div>
            <div class="flex justify-between"><span class="text-gray-600">Jumlah</span><span class="text-gray-900 font-bold text-lg">${fmt(inv.amount)}</span></div>
            <div class="flex justify-between"><span class="text-gray-600">No. Invoice</span><span class="text-gray-900 text-sm font-mono">${inv.external_id || '-'}</span></div>
            ${inv.expiry_date ? `<div class="flex justify-between"><span class="text-gray-600">Berlaku s.d.</span><span class="text-gray-900">${new Date(inv.expiry_date).toLocaleString('id-ID')}</span></div>` : ''}
            ${inv.paid_at ? `<div class="flex justify-between"><span class="text-gray-600">Dibayar pada</span><span class="text-gray-900">${new Date(inv.paid_at).toLocaleString('id-ID')}</span></div>` : ''}
          </div>`;

      if (isPaid) {
        bodyHtml += `
          <div class="text-center mt-6">
            <div class="inline-flex items-center px-6 py-3 bg-green-100 text-green-800 rounded-lg text-lg font-medium">
              <i class="fas fa-check-circle mr-2"></i> Pembayaran Berhasil
            </div>
          </div>`;
        stopPolling();
      } else if (isExpired) {
        bodyHtml += `
          <div class="text-center mt-6">
            <div class="inline-flex items-center px-6 py-3 bg-red-100 text-red-800 rounded-lg text-lg font-medium">
              <i class="fas fa-times-circle mr-2"></i> Invoice Kedaluwarsa
            </div>
          </div>`;
        stopPolling();
      } else {
        bodyHtml += `
          <div class="mt-4">
            <div class="rounded-lg overflow-hidden border border-gray-200" style="min-height:420px;">
              <iframe id="xenditFrame" src="${inv.invoice_url}" class="w-full" style="height:640px;border:0;" title="Pembayaran Xendit"></iframe>
            </div>
            <div class="text-center mt-3">
              <a href="${inv.invoice_url}" target="_blank" rel="noopener" class="text-sm text-emerald-600 hover:underline">
                <i class="fas fa-external-link-alt mr-1"></i> Buka halaman pembayaran di tab baru
              </a>
            </div>
            <p class="text-center text-xs text-gray-400 mt-2">Status diperbarui otomatis setelah pembayaran.</p>
          </div>`;
        startPolling();
      }

      document.getElementById('invoiceStatus').innerHTML = bodyHtml;
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/xendit/public/invoice-status?external_id=' + encodeURIComponent(externalId));
          const data = await res.json();
          if (data.success && normalizeStatus(data.data.status) === 'PAID') {
            renderInvoice(data.data);
          }
        } catch (e) { /* abaikan polling error */ }
      }, 5000);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    async function createTestInvoice() {
      const btn = document.getElementById('testPayBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Membuat invoice...';
      try {
        // Data dummy (tidak ambil dari database)
        const studentId = 999999;
        const amount = 100000;

        const res2 = await fetch('/api/xendit/public/create-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tenant_id: 'PPIB', student_id: parseInt(studentId), amount: amount })
        });
        const data = await res2.json();
        if (data.success) {
          const params = new URLSearchParams(window.location.search);
          params.set('external_id', data.data.external_id);
          window.history.replaceState({}, '', `${location.pathname}?${params}`);
          document.getElementById('invoiceStatus').innerHTML = '<div class="text-center py-8"><i class="fas fa-spinner fa-spin text-3xl text-gray-400 mb-4"></i><p>Mengarahkan ke halaman pembayaran...</p></div>';
          setTimeout(() => { window.location.href = data.data.payment_page_url; }, 500);
        } else throw new Error(data.message || 'Gagal membuat invoice');
      } catch (err) {
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-bolt mr-2"></i> Bayar SPP Siswa (Mode Test)';
        document.getElementById('invoiceStatus').innerHTML += `<p class="text-red-500 text-center mt-2">${err.message}</p>`;
      }
    }
  </script>
</body>

</html>
