<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #c { border: 1px solid #ccc; cursor: crosshair; }
  </style>
</head>
<body>
  <h2>Test Canvas Drag</h2>
  <button onclick="addText()">Add Text</button>
  <button onclick="addRect()">Add Rect</button>
  <br><br>
  <canvas id="c" width="350" height="220"></canvas>

  <script>
    let canvas = new fabric.Canvas('c', { selection: true });
    console.log('Canvas initialized:', canvas);

    function addText() {
      const text = new fabric.Textbox('Drag me!', { left: 50, top: 50, width: 150, fontSize: 16, fill: '#3b82f6' });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    function addRect() {
      const rect = new fabric.Rect({ left: 50, top: 100, width: 50, height: 40, fill: '#10b981', stroke: '#059669' });
      canvas.add(rect);
      canvas.setActiveObject(rect);
    }
  </script>
</body>
</html>
