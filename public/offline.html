<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Sistem Informasi Sekolah</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .offline-card {
      background: white;
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .offline-icon {
      width: 100px;
      height: 100px;
      background: #fef3c7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .offline-icon i {
      font-size: 48px;
      color: #92400e;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .retry-btn {
      margin-top: 24px;
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .retry-btn:hover {
      background: #43a047;
    }

    .retry-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .features {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      text-align: left;
    }

    .features h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.875rem;
      color: #64748b;
    }

    .feature-item i {
      color: #4CAF50;
      margin-top: 2px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">
      <i class="fas fa-wifi" style="font-size: 40px;">📡</i>
    </div>

    <h1>Anda Sedang Offline</h1>
    <p>
      <span class="status-dot"></span>
      Koneksi internet tidak tersedia.
    </p>
    <p>
      Beberapa fitur mungkin tidak dapat diakses.<br>
      Periksa koneksi internet Anda dan coba lagi.
    </p>

    <button class="retry-btn" onclick="window.location.reload()">
      <i class="fas fa-redo" style="margin-right: 6px;"></i>
      Coba Lagi
    </button>

    <div class="features">
      <h3>Yang tetap tersedia:</h3>
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>Halaman yang sudah pernah dibuka</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>Data absensi yang sudah tersimpan</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>Widget Al-Qur'an</span>
      </div>
      <div class="feature-item">
        <i class="fas fa-check-circle"></i>
        <span>Riwayat absensi terakhir</span>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('online', () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
