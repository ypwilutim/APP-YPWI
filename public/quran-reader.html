<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mushaf Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #e5d3b3;
      font-family: 'Scheherazade New', serif;
    }

    .mushaf-container {
      max-width: 500px;
      margin: 10px auto;
      background: #fdf6e3;
      min-height: 95vh;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 8px;
    }

    .quran-text {
      font-size: 1.8rem;
      line-height: 2.8;
      text-align: justify;
      direction: rtl;
      color: #2c1e0f;
    }

    .ayah-number {
      font-family: sans-serif;
      display: inline-block;
      padding: 0 5px;
      color: #856404;
      font-size: 1rem;
    }

    .nav-btn {
      background: #856404;
      color: #fff;
      padding: 10px 15px;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    .nav-btn:disabled {
      background: #ccc;
    }
  </style>
</head>

<body>

  <div class="mushaf-container">
    <div class="flex justify-between text-xs text-stone-600 mb-4 border-b pb-2">
      <span>Halaman: <span id="currentPage">1</span>/604</span>
      <span>Khatam: <span id="khatamCount">0</span>x</span>
    </div>

    <div id="quranText" class="quran-text">
      <div class="text-center py-20">Memuat mushaf...</div>
    </div>

    <div class="flex justify-between mt-8 pt-4 border-t">
      <button id="nextBtn" class="nav-btn"><i class="fas fa-arrow-left mr-2"></i>Selanjutnya</button>
      <button id="prevBtn" class="nav-btn"><i class="fas fa-arrow-right ml-2"></i>Sebelumnya</button>
    </div>
  </div>

  <script>
    let currentPage = parseInt(localStorage.getItem('quranPage') || '1');
    let khatamCount = parseInt(localStorage.getItem('khatamCount') || '0');

    const quranTextEl = document.getElementById('quranText');
    const pageEl = document.getElementById('currentPage');
    const khatamEl = document.getElementById('khatamCount');

    async function loadPage(page) {
      quranTextEl.innerHTML = '<div class="text-center py-20">Memuat...</div>';
      const res = await fetch(`https://api.alquran.cloud/v1/page/${page}/quran-uthmani`);
      const data = await res.json();

      let html = '';
      data.data.ayahs.forEach(a => {
        html += `${a.text} <span class="ayah-number">(${a.numberInSurah})</span> `;
      });
      quranTextEl.innerHTML = html;
      pageEl.textContent = page;
      khatamEl.textContent = khatamCount;
      localStorage.setItem('quranPage', page);
      localStorage.setItem('khatamCount', khatamCount);
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentPage < 604) {
        currentPage++;
      } else {
        currentPage = 1;
        khatamCount++;
      }
      loadPage(currentPage);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadPage(currentPage);
      }
    });

    loadPage(currentPage);
  </script>
</body>

</html>
