<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Guru - YPWI Absensi</title>

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Cari Guru - Sistem Absensi YPWI Lutim">
  <meta property="og:description"
    content="Temukan dan akses profil lengkap guru di Sistem Absensi YPWI Lutim. Cari berdasarkan nama, NIP, atau sekolah">
  <meta property="og:image" content="/assets/images/search-teacher.jpg">
  <meta property="og:url" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="YPWI Lutim Absensi">

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Cari Guru - Sistem Absensi YPWI Lutim">
  <meta name="twitter:description"
    content="Temukan dan akses profil lengkap guru di Sistem Absensi YPWI Lutim. Cari berdasarkan nama, NIP, atau sekolah">
  <meta name="twitter:image" content="/assets/images/thumbnail/search teacher.svg">

  <!-- General Meta Tags -->
  <meta name="description"
    content="Temukan dan akses profil lengkap guru di Sistem Absensi YPWI Lutim. Cari berdasarkan nama, NIP, atau sekolah">
  <meta name="keywords" content="cari guru, sistem absensi, YPWI Lutim, database guru, profil guru">
  <meta name="author" content="YPWI Lutim">

  <script>
    // Set dynamic og:url based on current location
    document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
  </script>

  <link rel="icon" href="assets/images/YPWI LOGO HITAM.png" type="image/png">
  <link href="styles.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-8">
    <!-- Header -->
    <div class="mb-8">
      <div class="flex items-center space-x-3 mb-4">
        <img src="assets/images/YPWI LOGO HITAM.png" alt="YPWI Logo"
          class="w-12 h-12 object-contain bg-white rounded-lg p-1">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Cari Guru</h1>
          <p class="text-gray-600 mt-1">Temukan dan akses profil lengkap guru</p>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-search text-gray-400"></i>
          </div>
          <input type="text" id="searchInput" placeholder="Ketik nama guru..."
            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            autocomplete="off">
        </div>
        <p class="text-sm text-gray-500 mt-2">
          <i class="fas fa-info-circle mr-1"></i>
          Ketik minimal 2 huruf nama guru untuk memulai pencarian.
        </p>
      </div>
    </div>

    <!-- Results -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100">
      <div class="p-6 border-b border-gray-100">
        <h2 class="text-lg font-semibold text-gray-900">Hasil Pencarian</h2>
        <p id="resultCount" class="text-sm text-gray-600 mt-1"><span id="count">0</span> guru ditemukan</p>
      </div>

      <div class="p-6">
        <div id="teachersList" class="space-y-4">
          <div class="text-center py-12 text-gray-500">
            <i class="fas fa-search text-4xl mb-4"></i>
            <p>Ketik nama guru untuk memulai pencarian</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Verification Modal -->
  <div id="verifyModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
    <div class="flex items-center justify-center min-h-screen p-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8">
        <div class="text-center mb-6">
          <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-blue-100 flex items-center justify-center">
            <i class="fas fa-user-shield text-blue-600 text-2xl"></i>
          </div>
          <h2 class="text-2xl font-bold text-gray-900">Verifikasi Identitas</h2>
          <p class="text-gray-600 mt-2">Pastikan ini adalah akun Anda, <span id="verifyTeacherName"
              class="font-semibold text-gray-900"></span>.</p>
        </div>

        <div class="space-y-4">
          <div>
            <label for="verifyType" class="block text-sm font-medium text-gray-700 mb-2">Jenis Verifikasi</label>
            <select id="verifyType"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white">
              <option value="email">Email</option>
              <option value="whatsapp">No. WhatsApp</option>
              <option value="nik">NIK</option>
              <option value="niy">NIY</option>
            </select>
          </div>
          <div>
            <label for="verifyValue" id="verifyValueLabel" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="text" id="verifyValue" placeholder="Masukkan data verifikasi"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            <p class="text-sm text-red-500 mt-2 hidden" id="verifyError">Data tidak cocok.</p>
          </div>
          <button id="verifyBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition">
            <i class="fas fa-check-circle mr-2"></i>
            Verifikasi
          </button>
        </div>

        <div class="mt-6 text-center">
          <button id="closeVerifyBtn" class="text-gray-500 hover:text-gray-700 text-sm">
            <i class="fas fa-arrow-left mr-1"></i>
            Batal
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    let allTeachers = [];
    let selectedTeacherId = null;

    async function fetchTeachers(searchTerm) {
      const container = document.getElementById('teachersList');
      const count = document.getElementById('count');
      count.textContent = '0';

      try {
        const url = `/api/search/teachers?q=${encodeURIComponent(searchTerm)}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Server error: ${response.status}`);
        const res = await response.json();

        if (res.success) {
          allTeachers = Array.isArray(res.data) ? res.data : (res.data ? [res.data] : []);
          displayTeachers(allTeachers);
        }
      } catch (error) {
        console.error('Teachers fetch error:', error);
        container.innerHTML = `
          <div class="text-center py-12 text-red-500">
            <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
            <p>Terjadi kesalahan saat memuat data. Silakan coba lagi.</p>
          </div>
        `;
      }
    }

    function displayTeachers(teachers) {
      const container = document.getElementById('teachersList');
      const count = document.getElementById('count');

      count.textContent = teachers.length;

      if (teachers.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-500">
            <i class="fas fa-user-slash text-4xl mb-4"></i>
            <p>Tidak ada guru ditemukan</p>
          </div>
        `;
        return;
      }

      container.innerHTML = teachers.map(teacher => `
        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer" onclick="openVerify(${teacher.id})">
          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
              <i class="fas fa-user text-blue-600"></i>
            </div>
            <div class="flex-1">
              <h3 class="font-medium text-gray-900">${teacher.nama || '-'}</h3>
              <p class="text-sm text-gray-600">NIK: ${teacher.nik || '-'} | NIP: ${teacher.nip || '-'}</p>
              ${teacher.assignments && teacher.assignments.length > 0 ?
        `<p class="text-xs text-blue-600 mt-1">🏫 ${teacher.assignments.map(a => a.nama_sekolah).join(', ')}</p>` :
        '<p class="text-xs text-gray-500 mt-1">Belum ditugaskan ke sekolah</p>'}
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <div class="flex flex-col items-end space-y-1">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${teacher.has_user ? 'bg-blue-100 text-blue-800' : 'bg-orange-100 text-orange-800'}">
                ${teacher.has_user ? 'Sudah Punya Akun' : 'Belum Punya Akun'}
              </span>
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${teacher.status_aktif ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                ${teacher.status_aktif ? 'Aktif' : 'Nonaktif'}
              </span>
            </div>
            <i class="fas fa-chevron-right text-gray-400"></i>
          </div>
        </div>
      `).join('');
    }

    // Verification Modal logic
    const verifyModal = document.getElementById('verifyModal');
    const verifyType = document.getElementById('verifyType');
    const verifyValue = document.getElementById('verifyValue');
    const verifyValueLabel = document.getElementById('verifyValueLabel');
    const verifyError = document.getElementById('verifyError');

    const typeLabels = {
      email: 'Email',
      whatsapp: 'No. WhatsApp',
      nik: 'NIK',
      niy: 'NIY'
    };

    function openVerify(teacherId) {
      const teacher = allTeachers.find(t => t.id == teacherId);
      if (!teacher) return;
      selectedTeacherId = teacherId;
      document.getElementById('verifyTeacherName').textContent = teacher.nama || '';
      verifyValue.value = '';
      verifyError.classList.add('hidden');
      verifyModal.classList.remove('hidden');
      updateVerifyLabel();
      verifyValue.focus();
    }

    function closeVerify() {
      verifyModal.classList.add('hidden');
      selectedTeacherId = null;
      verifyError.classList.add('hidden');
    }

    function updateVerifyLabel() {
      verifyValueLabel.textContent = typeLabels[verifyType.value] || 'Data';
      verifyValue.placeholder = `Masukkan ${typeLabels[verifyType.value] || 'data'} sesuai data guru`;
    }

    verifyType.addEventListener('change', updateVerifyLabel);
    document.getElementById('closeVerifyBtn').addEventListener('click', closeVerify);
    verifyModal.addEventListener('click', (e) => {
      if (e.target === verifyModal) closeVerify();
    });

    document.getElementById('verifyBtn').addEventListener('click', async () => {
      if (!selectedTeacherId) return;
      const value = verifyValue.value.trim();
      const type = verifyType.value;

      if (!value) {
        verifyError.textContent = 'Silakan isi data verifikasi.';
        verifyError.classList.remove('hidden');
        return;
      }

      const btn = document.getElementById('verifyBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Memverifikasi...';

      try {
        const response = await fetch(`/api/search/teachers/${selectedTeacherId}/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, value })
        });
        const data = await response.json();

        if (data.success) {
          const teacherIdToRedirect = selectedTeacherId;
          closeVerify();
          if (data.has_user && data.email) {
            window.location.href = `login.html?email=${encodeURIComponent(data.email)}`;
          } else {
            window.location.href = `complete-profile.html?teacher_id=${teacherIdToRedirect}`;
          }
        } else {
          verifyError.textContent = data.message || 'Data tidak cocok.';
          verifyError.classList.remove('hidden');
        }
      } catch (error) {
        console.error('Verify error:', error);
        verifyError.textContent = 'Terjadi kesalahan saat verifikasi. Silakan coba lagi.';
        verifyError.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>Verifikasi';
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('searchInput');
      let debounceTimeout = null;

      searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.trim();
        clearTimeout(debounceTimeout);

        if (searchTerm.length >= 2) {
          debounceTimeout = setTimeout(() => fetchTeachers(searchTerm), 400);
        } else {
          const container = document.getElementById('teachersList');
          const count = document.getElementById('count');
          count.textContent = '0';
          container.innerHTML = `
            <div class="text-center py-12 text-gray-500">
              <i class="fas fa-search text-4xl mb-4"></i>
              <p>Ketik minimal 2 huruf nama guru untuk memulai pencarian</p>
            </div>
          `;
        }
      });
    });
  </script>
</body>

</html>
